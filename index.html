<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atrament</title>
<meta name="description" content="Atrament by Egzey DevCorp. Pisanie opowieści z AI, które pamięta postacie i wydarzenia.">
<meta name="author" content="Egzey DevCorp">
<meta name="theme-color" content="#0F1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Atrament">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: aplikacja mobilna — przyklejony nagłówek, przewijana treść w kolumnie ~680px, dolny pasek zakładek. */
:root {
  --bg: #EEF0F3;
  --surface: #FFFFFF;
  --surface2: #E3E7ED;
  --fg: #151922;
  --muted: #5B6474;
  --line: #D2D8E0;
  --accent: #2E43B0;
  --accent-fg: #FFFFFF;
  --accent-soft: #DCE2FA;
  --warn: #8A5200;
  --warn-bg: #FFF0D2;
  --ok: #19704A;
  --ok-bg: #DAF2E4;
  --bad: #B02A1C;
  --bad-bg: #FCE3DF;
  --ins: #12663F;
  --ins-bg: #D3F0DF;
  --del: #A1281A;
  --del-bg: #FADBD6;
  --prose: 'Literata', Georgia, 'Times New Roman', serif;
  --ui: 'IBM Plex Sans', -apple-system, system-ui, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 10px;
  --nav-h: 50px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1218; --surface: #171B23; --surface2: #222833; --fg: #E6E9EF; --muted: #97A0AF; --line: #2D3441;
    --accent: #95A8FF; --accent-fg: #0F1218; --accent-soft: #252E55;
    --warn: #F2B653; --warn-bg: #36280E; --ok: #63D49C; --ok-bg: #11301F; --bad: #FF8E7E; --bad-bg: #3A1813;
    --ins: #7FE0AE; --ins-bg: #143524; --del: #FF9C8E; --del-bg: #431A14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1218; --surface: #171B23; --surface2: #222833; --fg: #E6E9EF; --muted: #97A0AF; --line: #2D3441;
  --accent: #95A8FF; --accent-fg: #0F1218; --accent-soft: #252E55;
  --warn: #F2B653; --warn-bg: #36280E; --ok: #63D49C; --ok-bg: #11301F; --bad: #FF8E7E; --bad-bg: #3A1813;
  --ins: #7FE0AE; --ins-bg: #143524; --del: #FF9C8E; --del-bg: #431A14;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; min-height: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh; min-height: 100lvh;
  font: 15px/1.5 var(--ui);
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; } /* iOS nie zoomuje przy >=16px */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* Nagłówek */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--prose); font-weight: 600; font-size: 19px; letter-spacing: .01em; display: flex; flex-direction: column; line-height: 1.1; flex: none; }
.brand small { font-family: var(--ui); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; color: var(--muted); margin-top: 2px; }
.proj-btn {
  margin-left: auto; min-width: 0; max-width: 62%;
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.proj-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-btn::after { content: "▾"; color: var(--muted); font-size: 12px; }

/* Treść */
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* Dolny pasek */
.nav {
  position: fixed; left: 0; right: 0; bottom: calc(-1 * var(--vfix, 0px)); z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: max(4px, calc(env(safe-area-inset-bottom, 0px) - 14px));
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav button {
  background: none; border: 0; cursor: pointer; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 500; letter-spacing: .02em; padding-top: 4px;
}
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); }

/* Elementy */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 160px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
h2.sec { font-family: var(--prose); font-size: 21px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 13px; font-weight: 500; color: var(--muted); }
input[type=text], input[type=password], input[type=url], input[type=number], input[type=search], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-width: 0;
}
textarea { resize: vertical; line-height: 1.5; min-height: 84px; }
select { appearance: none; -webkit-appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 9px 14px; cursor: pointer; font-weight: 500; font-size: 14.5px; min-height: 40px; white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13.5px; }
.icon-btn { background: none; border: 0; font-size: 26px; line-height: 1; padding: 4px 8px; cursor: pointer; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.acc { background: var(--accent-soft); color: var(--accent); }

.banner { border-radius: var(--r); padding: 11px 13px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--fg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.warn b { color: var(--warn); }
.banner.info { background: var(--accent-soft); }
.banner.bad { background: var(--bad-bg); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 7px 4px; font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .t { font-weight: 600; }
.item .d { font-size: 14px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item .side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.empty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 14px; }
.chap-head { padding: 8px 14px; background: var(--surface2); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Edytor prozy */
.prose {
  font-family: var(--prose); font-size: 18px; line-height: 1.7; min-height: 46vh;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 20px;
  font-variation-settings: "opsz" 16; overflow: hidden; resize: none;
}
.prose.streaming { border-color: var(--accent); }
input.scene-title { font-family: var(--prose); font-size: 20px; font-weight: 600; background: transparent; border: 0; padding: 2px 0; border-bottom: 1px dashed var(--line); border-radius: 0; }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
details.plan { display: block; }
details.plan > .stack { margin-top: 12px; gap: 12px; }
details.plan > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
details.plan > summary::-webkit-details-marker { display: none; }
details.plan > summary::after { content: "Zwiń"; margin-left: auto; font-size: 13px; color: var(--accent); }
details.plan:not([open]) > summary::after { content: "Rozwiń"; }

/* Arkusz (bottom sheet) */
#sheet { position: fixed; inset: 0 0 calc(-1 * var(--vfix, 0px)); z-index: 50; }
.sheet-bg { position: absolute; inset: 0; background: rgb(5 8 14 / .5); }
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px);
  background: var(--surface); border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); max-width: 760px; margin: 0 auto;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet-panel { animation: none; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-family: var(--prose); font-size: 19px; font-weight: 600; flex: 1; min-width: 0; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet-foot { position: sticky; bottom: -18px; background: var(--surface); padding: 10px 0 4px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 4px; }
.sheet-foot .btn { flex: 1 1 130px; }

/* Diff */
.diff { font-family: var(--prose); font-size: 17px; line-height: 1.75; white-space: pre-wrap; word-wrap: break-word; background: var(--bg); border-radius: var(--r); padding: 14px; }
.hunk { display: inline; border: 0; padding: 0 1px; margin: 0; background: none; font: inherit; cursor: pointer; border-radius: 3px; text-align: left; }
.hunk del { background: var(--del-bg); color: var(--del); text-decoration: line-through; }
.hunk ins { background: var(--ins-bg); color: var(--ins); text-decoration: none; }
.hunk.off del { text-decoration: none; background: transparent; color: inherit; }
.hunk.off ins { display: none; }
.hunk:focus-visible { outline: 2px solid var(--accent); }

.variant { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.variant p { margin: 0; font-family: var(--prose); font-size: 16.5px; line-height: 1.65; white-space: pre-wrap; }
.skel { height: 74px; border-radius: 8px; background: linear-gradient(90deg, var(--surface2), var(--bg), var(--surface2)); background-size: 200% 100%; animation: sh 1.3s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

.xitem { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.xitem:first-of-type { border-top: 0; }
.xitem input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.xitem .x { flex: 1; min-width: 0; font-size: 14.5px; }
pre.ctx { white-space: pre-wrap; word-wrap: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.5; background: var(--bg); padding: 12px; border-radius: 8px; margin: 0; max-height: 60vh; overflow: auto; }

.toggle { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(1turn); } }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px - var(--vfix, 0px)); z-index: 60;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 520px); box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
#toast.bad { background: var(--bad); color: #fff; }
.model-row { display: flex; flex-direction: column; gap: 2px; padding: 10px 2px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; width: 100%; }
.model-row .mono { color: var(--muted); }
a { color: var(--accent); }

/* Książka */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--prose); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.chap-card { padding: 0; gap: 0; overflow: hidden; }
.chap-card .ch-top { display: flex; gap: 8px; align-items: flex-start; padding: 12px 12px 10px 14px; }
.chap-card .ch-top .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ch-num { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ch-title { font-family: var(--prose); font-size: 17px; font-weight: 600; }
.part-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 2px 0; }
.mv { display: flex; gap: 2px; flex: none; }
.mv button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 15px; line-height: 1; color: var(--muted); }
.mv button[disabled] { opacity: .35; pointer-events: none; }
.sc-row { display: flex; gap: 8px; align-items: center; padding: 8px 12px 8px 14px; border-top: 1px solid var(--line); }
.sc-row .nm { flex: 1; min-width: 0; background: none; border: 0; text-align: left; cursor: pointer; padding: 4px 0; display: flex; flex-direction: column; }
.sc-row .nm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-row.off .nm { opacity: .45; text-decoration: line-through; }
.sc-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

.book { font-family: var(--prose); font-size: 18.5px; line-height: 1.7; hyphens: auto; -webkit-hyphens: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 22px 40px; }
.book p { margin: 0; text-indent: 1.4em; text-align: justify; }
.book .noind, .book h2 + p, .book .sep + p, .book .chap-sub + p { text-indent: 0; }
.book .front { text-align: center; padding: 40px 0 70px; display: flex; flex-direction: column; gap: 10px; }
.book .front h1 { font-size: 34px; line-height: 1.2; font-weight: 600; }
.book .front .sub { font-style: italic; color: var(--muted); }
.book .front .auth { margin-top: 18px; letter-spacing: .12em; text-transform: uppercase; font-size: 15px; }
.book .dedic { text-align: center; font-style: italic; padding: 30px 0; }
.book .motto { text-align: right; font-style: italic; padding: 10px 0 40px; max-width: 30em; margin-left: auto; }
.book .part { text-align: center; padding: 70px 0; font-size: 24px; font-weight: 600; letter-spacing: .04em; }
.book h2 { text-align: center; font-size: 15px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; margin: 64px 0 4px; }
.book .chap-sub { text-align: center; font-size: 23px; font-weight: 600; margin: 0 0 30px; text-wrap: balance; }
.book .sep { text-align: center; margin: 20px 0; letter-spacing: .3em; color: var(--muted); }
.toc-jump { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 5; }

#print { display: none; }
@media print {
  @page { size: A5; margin: 18mm 16mm 20mm; }
  body { background: #fff; color: #000; padding: 0; }
  body::before, .top, .nav, main, #sheet, #toast { display: none !important; }
  #print { display: block; }
  #print .book { border: 0; padding: 0; background: #fff; color: #000; font-size: 10.5pt; line-height: 1.45; }
  #print .book .front, #print .book .part { page-break-after: always; break-after: page; min-height: 60vh; }
  #print .book .dedic, #print .book .motto { break-after: page; }
  #print .book h2 { break-before: page; margin-top: 30mm; }
  #print .book .sub, #print .book .sep { color: #444; }
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <span class="brand">Atrament<small>by Egzey DevCorp</small></span>
  <button class="proj-btn" data-a="openProjects" aria-label="Zmień projekt"><span id="projName">…</span></button>
</div></header>

<main><div class="wrap" id="view"></div></main>

/* ============================== Baza (IndexedDB) ============================== */
const DB = {
  db: null, mem: new Map(),
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('atrament', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch { res(); }
    });
  },
  get(k) {
    if (!this.db) return Promise.resolve(this.mem.get(k));
    return new Promise(res => {
      const q = this.db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => res(undefined);
    });
  },
  set(k, v) {
    if (!this.db) { this.mem.set(k, v); return Promise.resolve(); }
    return new Promise(res => {
      const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k);
      tx.oncomplete = () => res(); tx.onerror = () => { toast('Nie udało się zapisać danych na urządzeniu.', true); res(); };
    });
  },
  del(k) {
    if (!this.db) { this.mem.delete(k); return Promise.resolve(); }
    return new Promise(res => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => res(); });
  }
};

const curScene = () => { if (!S.sceneId) return null; for (const c of S.project.chapters) { const s = c.scenes.find(x => x.id === S.sceneId); if (s) return s; } return null; };
const chapterOf = sceneId => S.project.chapters.find(c => c.scenes.some(s => s.id === sceneId));

function stem(n) { const s = n.toLowerCase(); if (s.length >= 6) return s.slice(0, -2); if (s.length >= 4) return s.slice(0, -1); return s; }
function mentions(text, c) {
  const t = (text || '').toLowerCase();

/* ============================== Model (API) ============================== */
function httpError(status, text) {
  let m = ''; try { const j = JSON.parse(text); m = j.error?.message || j.message || ''; } catch { m = (text || '').slice(0, 160); }
  const map = {
    400: 'Model odrzucił zapytanie.', 401: 'Nieprawidłowy klucz API. Sprawdź go w Ustawieniach.', 402: 'Brak środków na koncie OpenRouter. Doładuj konto albo wybierz tańszy model.',
    403: 'Dostawca zablokował zapytanie (moderacja treści albo uprawnienia klucza).', 404: 'Nie znaleziono modelu albo żaden dostawca nie spełnia Twoich ustawień prywatności. Wyłącz ZDR albo zmień model.',
    408: 'Model nie odpowiedział na czas. Spróbuj ponownie.', 413: 'Za długi tekst dla tego modelu.', 429: 'Limit zapytań. Odczekaj chwilę albo zmień model.',
    500: 'Błąd po stronie dostawcy. Spróbuj ponownie.', 502: 'Dostawca modelu nie odpowiada. Spróbuj ponownie.', 503: 'Brak dostępnego dostawcy dla tego modelu. Spróbuj za chwilę.',
  };
  const e = new UserError((map[status] || ('Błąd ' + status + '.')) + (m ? ' Szczegóły: ' + m : ''));
  e.status = status; return e;
}

async function llm(role, messages, opt = {}) {
  const st = S.settings, r = st.roles[role];
  const isOR = r.provider === 'openrouter';
  const base = isOR ? 'https://openrouter.ai/api/v1' : (st.customBase || '').trim().replace(/\/+$/, '');
  const key = isOR ? st.orKey.trim() : (st.customKey || '').trim();
  if (isOR && !key) throw new UserError('Brak klucza OpenRouter. Dodaj go w Ustawieniach.');
  if (!isOR && !base) throw new UserError('Brak adresu własnego endpointu. Uzupełnij go w Ustawieniach.');
  if (!r.model) throw new UserError('Nie wybrano modelu dla roli: ' + ROLE_INFO[role].name + '.');

  const body = { model: r.model, messages, temperature: opt.temp ?? r.temp, stream: !!opt.stream };
  if (opt.maxTokens) body.max_tokens = opt.maxTokens;
  if (opt.json) body.response_format = { type: 'json_object' };
  if (isOR) {
    body.provider = {};
    if (st.denyTraining) body.provider.data_collection = 'deny';
    if (st.zdr) body.provider.zdr = true;
    if (role === 'writer') body.reasoning = st.reasoning === 'off' ? { enabled: false } : { effort: st.reasoning, exclude: true };
    body.usage = { include: true };
  }
  const headers = { 'Content-Type': 'application/json' };
  if (key) headers.Authorization = 'Bearer ' + key;
  if (isOR) { headers['HTTP-Referer'] = location.origin; headers['X-Title'] = 'Atrament'; }

  const send = b => fetch(base + '/chat/completions', { method: 'POST', headers, body: JSON.stringify(b), signal: opt.signal });
  let res;
  try { res = await send(body); }
  catch (e) { if (e.name === 'AbortError') throw e; throw new UserError('Brak połączenia z ' + (isOR ? 'OpenRouter' : base) + '. Sprawdź internet' + (isOR ? '.' : ' i czy endpoint pozwala na zapytania z przeglądarki (CORS).')); }
  if (res.status === 400 && (body.reasoning || body.response_format)) {
    // część modeli nie zna tych parametrów: ponów bez nich
    delete body.reasoning; delete body.response_format;
    res = await send(body);
  }
  if (!res.ok) throw httpError(res.status, await res.text().catch(() => ''));

  let text = '', usage = null;
  if (opt.stream && res.body) {
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim();
        if (!d || d === '[DONE]') continue;
        let j; try { j = JSON.parse(d); } catch { continue; }
        if (j.error) throw new UserError('Model przerwał: ' + (j.error.message || 'nieznany błąd'));
        const c = j.choices?.[0]?.delta?.content;
        if (c) { text += c; opt.onDelta?.(text); }
        if (j.usage) usage = j.usage;
      }
    }
  } else {
    const j = await res.json();
    if (j.error) throw new UserError('Model zwrócił błąd: ' + (j.error.message || ''));
    text = j.choices?.[0]?.message?.content || '';
    usage = j.usage || null;
  }
  if (usage?.cost) { st.spent = (st.spent || 0) + usage.cost; saveSettings(); }
  return { text, usage, model: r.model };
}

function cleanOutput(t) {
  return (t || '').replace(/\r/g, '')
    .replace(/<think>[\s\S]*?<\/think>/gi, '')
    .replace(/^\s*#{1,6}\s.*\n/, '')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/^\s*(scena|rozdział)\s*\d*\s*[:.].*\n/i, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
function parseJSON(t) {
  if (!t) return null;
  const s = t.replace(/```json|```/g, '');
  try { return JSON.parse(s); } catch {}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch {} }
  return null;
}
function usageLine(u) {
  if (!u) return '';
  const parts = [];
  if (u.prompt_tokens != null) parts.push(fmtN(u.prompt_tokens) + ' → ' + fmtN(u.completion_tokens) + ' tok');
  if (u.cost != null) parts.push('$' + Number(u.cost).toFixed(4));
  return parts.join(' · ');
}

async function languageTool(text) {
  const body = new URLSearchParams({ text: text.slice(0, 18000), language: 'pl-PL' });
  const r = await fetch('https://api.languagetool.org/v2/check', { method: 'POST', body });
  if (!r.ok) throw new Error('LT ' + r.status);
  const j = await r.json();
  return (j.matches || []).map(m => ({
    bad: text.substr(m.offset, m.length),
    ctx: text.slice(Math.max(0, m.offset - 25), m.offset + m.length + 25).replace(/\s+/g, ' '),
    msg: m.message, rep: (m.replacements || []).slice(0, 3).map(x => x.value),
  }));
}

/* ============================== Budowa kontekstu ============================== */
function wordSet(t) { return new Set(((t || '').toLowerCase().match(/\p{L}{5,}/gu) || []).map(w => w.slice(0, 6))); }
function overlap(a, b) { let n = 0; for (const x of a) if (b.has(x)) n++; return n; }

function scenesBefore(p, sc) {
  const out = [];
  for (const c of p.chapters) for (const s of c.scenes) { if (s.id === sc.id) return out; out.push({ c, s }); }
  return out;
}
function relevantEvents(p, sc, present, limit = 24) {
  const q = wordSet(sc.plan + ' ' + sc.title);
  const evs = p.events.map((e, i) => {
    let score = 0;
    for (const id of e.who || []) if (present.includes(id)) score += 3;
    score += overlap(wordSet(e.text + ' ' + (e.consequence || '')), q);
    if (e.important) score += 2;
    score += i / Math.max(1, p.events.length);
    return { e, i, score };
  });
  const last = new Set(evs.slice(-5).map(x => x.i));
  const picked = evs.filter(x => !last.has(x.i)).sort((a, b) => b.score - a.score).slice(0, limit - last.size);
  const all = [...picked, ...evs.filter(x => last.has(x.i))].sort((a, b) => a.i - b.i);
  return all.map(x => x.e);
}
function relevantThreads(p, sc, present, limit = 12) {
  const q = wordSet(sc.plan);
  return p.threads.filter(t => t.status === 'open')
    .map(t => ({ t, s: (t.who || []).filter(id => present.includes(id)).length * 3 + overlap(wordSet(t.text), q) }))
    .sort((a, b) => b.s - a.s).slice(0, limit).map(x => x.t);
}
function charCard(c, full) {
  const L = [`### ${c.name}${c.aliases ? ' (' + c.aliases + ')' : ''}${c.role ? ' — ' + c.role : ''}`];
  if (c.description) L.push('Kim jest: ' + c.description);
  if (full) {
    if (c.motivation) L.push('Motywacja: ' + c.motivation);
    if (c.voice) L.push('Sposób mówienia: ' + c.voice);
    if (c.relations) L.push('Relacje: ' + c.relations);
    if (c.changes?.length) L.push('Zmiany w toku opowieści: ' + c.changes.slice(-8).join('; '));
    if (c.knows?.length) L.push('WIE: ' + c.knows.slice(-15).join('; '));
    if (c.unknown) L.push('NIE WIE (nie może się tym posługiwać ani o tym wspominać): ' + c.unknown);
  }
  return L.join('\n');
}
function evLine(p, e) {
  const ci = chapterIndex(e.chapterId);
  return `- [${ci >= 0 ? 'R' + (ci + 1) : '—'}] ${e.text}${e.consequence ? ' → ' + e.consequence : ''}`;
}
function lastEndings(p, sc, n = 3) {
  return scenesBefore(p, sc).filter(x => x.s.text).slice(-n).map(x => splitParas(x.s.text).slice(-2).join(' ').slice(-240));
}
function pickEnding(p, sc) {
  const recent = scenesBefore(p, sc).slice(-3).map(x => x.s.endingUsed).filter(Boolean);
  const pool = Object.keys(ENDINGS).filter(k => !recent.includes(k));
  return pool[Math.floor(Math.random() * pool.length)] || 'cliff';
}

const WRITER_SYS = `Jesteś współautorem powieści i piszesz po polsku jak doświadczony polski prozaik: naturalną, poprawną polszczyzną (odmiana, składnia, interpunkcja, aspekt czasowników), nie jak tłumaczenie.

Zasady:
- Trzymaj się kanonu z sekcji PAMIĘĆ. Postać wie tylko to, co ma w polu WIE. Nigdy nie daje po sobie poznać rzeczy z pola NIE WIE.
- Postacie mówią swoim głosem (Sposób mówienia) i działają zgodnie z motywacjami. Jeśli działają wbrew nim, musi to wynikać z sytuacji.
- Nawiązuj do wcześniejszych wydarzeń i otwartych wątków, gdy to naturalne: konkretnym detalem, nie streszczeniem.
- Pokazuj zamiast mówić. Konkret zamiast ogólników. Bez purpurowej prozy i bez patosu.
- Zakończenie: nie kończ podsumowaniem, morałem ani refleksją narratora. Żadnych krótkich, jednozdaniowych akapitów-puent na końcu (np. „I to było wszystko.”, „To było jego.”, „Bo to było wieczne.”). Żadnej anafory „I to było…”. Czytelnik sam wyciąga wnioski.
- Nie używaj fraz z listy ZAKAZANE ani ich parafraz.
- Zwracasz wyłącznie tekst prozy. Bez tytułu, bez komentarzy, bez markdown.`;

function memoryBlock(p, sc, present) {
  const B = [];
  if (p.style.guide.trim()) B.push('## STYL I ŚWIAT\n' + p.style.guide.trim());
  if (p.style.sample.trim()) B.push('## PRÓBKA STYLU AUTORA (naśladuj rytm i słownictwo, nie treść)\n' + p.style.sample.trim().slice(0, 7000));
  const pres = present.map(charById).filter(Boolean);
  if (pres.length) B.push('## POSTACIE W SCENIE\n' + pres.map(c => charCard(c, true)).join('\n\n'));
  const others = p.characters.filter(c => !present.includes(c.id));
  if (others.length) B.push('## INNE POSTACIE (tło)\n' + others.map(c => `- ${c.name}${c.role ? ': ' + c.role : ''}${c.description ? '. ' + c.description.slice(0, 120) : ''}`).join('\n'));
  // Historia: streszczenia poprzednich rozdziałów + scen bieżącego
  const ch = chapterOf(sc.id) || curChapter();
  const ci = chapterIndex(ch.id);
  const H = [];
  p.chapters.slice(0, ci).forEach((c, i) => {
    const sum = c.summary || c.scenes.map(s => s.summary).filter(Boolean).join(' ');
    if (sum) H.push(`R${i + 1}. ${c.title}: ${sum}`);
  });
  const before = ch.scenes.slice(0, ch.scenes.findIndex(s => s.id === sc.id));
  before.forEach(s => { if (s.summary) H.push(`R${ci + 1}, ${s.title}: ${s.summary}`); });
  if (H.length) B.push('## HISTORIA DOTĄD\n' + H.join('\n'));
  const evs = relevantEvents(p, sc, present);
  if (evs.length) B.push('## WAŻNE FAKTY I WYDARZENIA\n' + evs.map(e => evLine(p, e)).join('\n'));
  const th = relevantThreads(p, sc, present);
  if (th.length) B.push('## OTWARTE WĄTKI (materiał do nawiązań; nie musisz rozwiązywać)\n' + th.map(t => '- ' + t.text).join('\n'));
  const banned = lines(p.banned);
  if (banned.length) B.push('## ZAKAZANE\n' + banned.map(b => '- ' + b).join('\n'));
  return '# PAMIĘĆ OPOWIEŚCI\n\n' + B.join('\n\n');
}

function buildWriterMessages(p, sc, mode, extra = {}) {
  const present = sc.who || [];
  const parts = [memoryBlock(p, sc, present)];
  const prev = scenesBefore(p, sc).filter(x => x.s.text).slice(-1)[0];
  if (prev && mode !== 'ideas') parts.push('# KONIEC POPRZEDNIEJ SCENY (dla ciągłości, nie kopiuj konstrukcji)\n…' + prev.s.text.slice(-900));
  const ends = lastEndings(p, sc);
  if (mode === 'scene') {
    const e = ENDINGS[extra.ending];
    parts.push(`# ZADANIE
Napisz scenę „${sc.title}”, około ${sc.words} słów.
Plan sceny: ${sc.plan.trim() || '(brak, poprowadź akcję naturalnie dalej, korzystając z otwartych wątków)'}
Postacie obecne: ${whoNames(present).join(', ') || 'według planu'}.
Zakończenie (${e.label}): ${e.ins}` + (ends.length ? `\nOstatnie sceny kończyły się tak. Nie kończ podobnie ani podobną konstrukcją:\n${ends.map(x => '- „' + x + '”').join('\n')}` : ''));
  } else if (mode === 'continue') {
    parts.push('# TEKST SCENY DO TEJ PORY\n' + sc.text + `\n\n# ZADANIE\nKontynuuj tę scenę dokładnie od miejsca, w którym się urywa (około 300–500 słów). Nie powtarzaj tego, co już jest. Plan sceny: ${sc.plan.trim() || '—'}`);
  } else if (mode === 'ending') {
    const e = extra.ending ? ENDINGS[extra.ending] : null;
    parts.push('# SCENA BEZ ZAKOŃCZENIA\n' + extra.base + `\n\n# ZADANIE\nNapisz WYŁĄCZNIE zakończenie tej sceny: 1–3 akapity, które płynnie kontynuują ostatnie zdanie. Nie powtarzaj tekstu, który już jest.` + (e ? `\nTyp zakończenia (${e.label}): ${e.ins}` : '') + (ends.length ? `\nNie kończ podobnie do poprzednich scen:\n${ends.map(x => '- „' + x + '”').join('\n')}` : ''));
  } else if (mode === 'ideas') {
    parts.push(`# ZADANIE
Zaproponuj 5 wyraźnie różnych pomysłów na następną scenę. Wykorzystaj otwarte wątki i wcześniejsze wydarzenia (nawiązania, konsekwencje, powroty), ale nie rozwiązuj wszystkiego naraz. Przynajmniej jeden pomysł ma być zaskakujący.
Format: każdy pomysł w osobnej linii, dokładnie tak:
TYTUŁ :: plan sceny w 2–3 zdaniach
Bez numeracji, bez wstępu, bez komentarzy.`);
  }
  return [{ role: 'system', content: WRITER_SYS }, { role: 'user', content: parts.join('\n\n') }];
}

const EDITOR_SYS = `Jesteś korektorem i redaktorem językowym polskiej prozy. Poprawiasz WYŁĄCZNIE:
- błędy ortograficzne, literówki, błędną odmianę i składnię, interpunkcję,
- kalki z angielskiego i niepolskie konstrukcje,

- powtórzenia tego samego słowa w bliskim sąsiedztwie.
NIE zmieniasz fabuły, kolejności, stylu, tonu, długości ani treści dialogów (poza błędami). Nie dodajesz zdań. Zachowujesz podział na akapity.
Zwróć cały poprawiony tekst i nic więcej.`;

const MEMORY_SYS = `Jesteś archiwistą powieści. Czytasz nową scenę i aktualizujesz pamięć opowieści. Piszesz po polsku, zwięźle, samymi faktami (kto, co, komu, gdzie). Nie wymyślasz niczego, czego nie ma w scenie. Zwracasz WYŁĄCZNIE poprawny JSON.`;

function buildExtractMessages(p, sc) {

  const user = `ZNANE POSTACIE:
${chars}

${th}

ZNANE FAKTY (kanon):
${evs}

Zwróć JSON dokładnie w tym kształcie:

  "knowledge": [{"character": "Imię", "learned": "czego ta postać dowiedziała się w tej scenie"}],
  "character_updates": [{"character": "Imię", "change": "trwała zmiana: relacja, stan, decyzja"}],
  "new_characters": [{"name": "Imię", "description": "kim jest, jedno zdanie"}],
  "threads_opened": [{"text": "nowa zagadka, obietnica, zapowiedź albo niewyjaśniony detal", "who": ["Imię"]}],
  "threads_closed": [{"id": "identyfikator z listy", "resolution": "jak się rozwiązał"}],
  "continuity": ["sprzeczność sceny z kanonem albo z tym, co postać może wiedzieć; pusta lista, jeśli brak"]
}
Wydarzenia: 2–8 najważniejszych faktów, nie opisy nastroju. "important": true tylko dla faktów, które będą miały znaczenie później. Nie dodawaj jako nowe postaci, które są już na liście znanych.`;
  return [{ role: 'system', content: MEMORY_SYS }, { role: 'user', content: user }];
}

/* ============================== Wykrywacz tików ============================== */
const ANAPHORA = /^((i|bo|a|ale)\s+)?to\s+(było|był|była|byli|były|jest|będzie|wystarcz\p{L}*)\b/iu;
const REFLECT = /(nic już nie (będzie|było)|po raz pierwszy od (dawna|lat)|w głębi (duszy|serca)|tak właśnie (miało|musiało)|wiedział(a)?, że (to|teraz|już))/iu;
function detectTics(text, p) {
  const out = [];
  const paras = splitParas(text);
  if (paras.length < 2) return { tics: out, shortTail: 0 };
  let shortTail = 0;
  for (let i = paras.length - 1; i >= Math.max(0, paras.length - 4); i--) {
    const s = paras[i];
    if (wc(s) <= 8 && !/^[„"–—-]/.test(s)) shortTail++; else break;
  }
  if (shortTail >= 2) out.push({ id: 'puenta', label: `Puenta na końcu: ${shortTail} krótkie akapity jeden pod drugim` });
  const tail = paras.slice(-3);
  const ana = tail.filter(s => ANAPHORA.test(s));
  if (ana.length) out.push({ id: 'anafora', label: 'Zakończenie typu „I to było…”: ' + ana.map(s => '„' + s.slice(0, 60) + '”').join(', ') });
  if (REFLECT.test(paras[paras.length - 1])) out.push({ id: 'refleksja', label: 'Refleksja narratora w ostatnim akapicie' });
  const low = text.toLowerCase();
  const hit = lines(p.banned).filter(b => low.includes(b.toLowerCase()));
  if (hit.length) out.push({ id: 'zakazane', label: 'Zakazane frazy: ' + hit.map(h => '„' + h + '”').join(', ') });
  return { tics: out, shortTail };
}
function endingTicCount(p, ch, exceptId) {
  return ch.scenes.filter(s => s.id !== exceptId && s.status === 'accepted' && s.tickEnding).length;
}

/* ============================== Diff słów ============================== */
function tokenize(s) { return s.match(/\s*\S+/g) || []; }
function lcsOps(a, b) {
  const n = a.length, m = b.length;
  if (n * m > 4e6) return [{ t: 'del', s: a.join('') }, { t: 'ins', s: b.join('') }];
  const W = m + 1, dp = new Uint32Array((n + 1) * W);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i * W + j] = a[i].trim() === b[j].trim() ? dp[(i + 1) * W + j + 1] + 1 : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
  const ops = []; let i = 0, j = 0;
  const push = (t, s) => { const l = ops[ops.length - 1]; if (l && l.t === t) l.s += s; else ops.push({ t, s }); };
  while (i < n && j < m) {
    if (a[i].trim() === b[j].trim()) { push('eq', b[j]); i++; j++; }
    else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { push('del', a[i]); i++; }
    else { push('ins', b[j]); j++; }
  }
  while (i < n) push('del', a[i++]);
  while (j < m) push('ins', b[j++]);
  return ops;
}
function diffHunks(orig, fixed) {
  const pa = splitParas(orig), pb = splitParas(fixed);
  let ops = [];
  if (pa.length === pb.length) {
    pa.forEach((x, k) => { if (k) ops.push({ t: 'eq', s: '\n\n' }); ops.push(...lcsOps(tokenize(x), tokenize(pb[k]))); });
  } else {
    ops = lcsOps(tokenize(joinParas(pa)), tokenize(joinParas(pb)));
  }
  // scal del+ins w hunki
  const segs = [];
  for (const o of ops) {
    if (o.t === 'eq') segs.push({ eq: o.s });
    else {
      let h = segs[segs.length - 1];
      if (!h || h.eq != null) { h = { del: '', ins: '', on: true }; segs.push(h); }
      h[o.t] += o.s;
    }
  }
  return segs;
}
function applyHunks(segs) { return segs.map(s => s.eq != null ? s.eq : (s.on ? s.ins : s.del)).join('').replace(/[ \t]+\n/g, '\n').trim(); }

  <button class="btn ghost danger" data-a="delScene">Usuń scenę</button>`}`;

function updateTicBanner() {
  const el = $('#ticBanner'); const sc = curScene(); if (!el || !sc) return;
  if (!S.project.tics.detect || GEN || !sc.text.trim()) { el.innerHTML = ''; return; }
  const { tics, shortTail } = detectTics(sc.text, S.project);
  if (!tics.length) { el.innerHTML = ''; return; }
  const ch = chapterOf(sc.id);
  const endingTic = tics.some(t => t.id !== 'zakazane');
  const used = endingTicCount(S.project, ch, sc.id);
  const over = endingTic && used >= S.project.tics.budget;
  el.innerHTML = `<div class="banner warn"><div><b>Wykryte tiki</b>${over ? ` · w tym rozdziale był już ${used} taki koniec (limit: ${S.project.tics.budget})` : ''}</div>
    <div class="stack small">${tics.map(t => '<div>• ' + esc(t.label) + '</div>').join('')}</div>
    <div class="row">${shortTail >= 2 ? '<button class="btn sm" data-a="cutTail">Utnij puentę</button>' : ''}${endingTic ? '<button class="btn sm" data-a="endings">Daj 3 inne zakończenia</button>' : ''}</div></div>`;
}

/* ============================== Edycja pól ============================== */
function scopeObj(scope) {
  if (scope === 'scene') return curScene();
  if (scope === 'project') return S.project;
  if (scope === 'style') return S.project.style;
  if (scope === 'tics') return S.project.tics;
  if (scope === 'book') return S.project.book;
  if (scope === 'settings') return S.settings;
  if (scope.startsWith('role_')) return S.settings.roles[scope.slice(5)];
  if (scope.startsWith('chap:')) return S.project.chapters.find(c => c.id === scope.slice(5));
  return null;
}
let ctxT = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'chapterSel') { S.project.currentChapter = el.value; saveProject(); render(); return; }
  if (el.id === 'evFilter') { S.evFilter = el.value; render(); return; }
  if (el.id === 'modelSearch') { renderModelList(el.value); return; }
  const f = el.dataset.f; if (!f) return;
  const dot = f.lastIndexOf('.'); const scope = f.slice(0, dot), key = f.slice(dot + 1);
  const obj = scopeObj(scope); if (!obj) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type === 'number' || el.type === 'range' || key === 'words') v = Number(v);
  obj[key] = v;
  if (el.classList.contains('auto')) autosize(el);
  if (scope === 'settings' || scope.startsWith('role_')) {
    saveSettings();
    if (el.type === 'range') { const t = $('#tv_' + scope.slice(5)); if (t) t.textContent = v; }
    if (key === 'provider') render();
  } else saveProject();
  if (scope === 'project' && key === 'title') $('#projName').textContent = v;
  if (scope === 'scene' && key === 'text') updateTicBanner();
  if (scope === 'scene' && key === 'plan') {
    clearTimeout(ctxT); ctxT = setTimeout(() => { const c = $('#ctxSize'), sc = curScene(); if (c && sc) c.textContent = 'Kontekst: ~' + fmtN(estTok(buildWriterMessages(S.project, sc, 'scene', { ending: 'cliff' }).map(m => m.content).join(''))) + ' tokenów'; }, 400);
  }
});

// --- pisanie
async function streamInto(sc, messages, { append } = {}) {
  const base = append ? sc.text.replace(/\s+$/, '') + '\n\n' : '';
  GEN = { ctrl: new AbortController() };
  render();
  const ta = $('#sceneText');
  let follow = true;
  const onScroll = () => { follow = innerHeight + scrollY >= document.documentElement.scrollHeight - 160; };
  addEventListener('scroll', onScroll, { passive: true });
  try {
    const r = await llm('writer', messages, {
      stream: true, signal: GEN.ctrl.signal, onDelta: full => {
        sc.text = base + cleanOutput(full); if (ta) { ta.value = sc.text; autosize(ta); }
        if (follow) scrollTo(0, document.documentElement.scrollHeight);
      }
    });
    sc.text = base + cleanOutput(r.text);
    sc.usage = r.usage;
    return r;
  } catch (e) {
    if (e.name === 'AbortError') { toast('Zatrzymano.'); return null; }
    throw e;
  } finally {
    removeEventListener('scroll', onScroll);
    GEN = null; saveProject(); render();
  }
}
A.generate = async () => {
  if (GEN) return;
  const p = S.project, sc = curScene();
  if (!sc.who?.length) { const f = p.characters.filter(c => mentions(sc.plan, c)).map(c => c.id); if (f.length) sc.who = f; }
  const ending = sc.ending === 'auto' ? pickEnding(p, sc) : sc.ending;
  const messages = buildWriterMessages(p, sc, 'scene', { ending });
  pushHistory(sc); sc.text = ''; sc.endingUsed = ending; sc.status = 'draft';
  const r = await streamInto(sc, messages);
  if (r) { sc.gen = { messages, output: sc.text, model: r.model, at: Date.now() }; saveProject(); }
};
A.continue = async () => {
  if (GEN) return;
  const sc = curScene(); const messages = buildWriterMessages(S.project, sc, 'continue');
  pushHistory(sc);
  const r = await streamInto(sc, messages, { append: true });
  if (r && sc.gen) { sc.gen.output = sc.text; saveProject(); }
};
A.stop = () => GEN?.ctrl.abort();

A.cutTail = () => {

  pushHistory(sc); const ps = splitParas(sc.text); sc.text = joinParas(ps.slice(0, ps.length - shortTail)); saveProject(); render(); toast('Ucięto końcową puentę.');
};

// --- inne zakończenia
A.endings = async () => {
  const p = S.project, sc = curScene();
  const ps = splitParas(sc.text);
  if (ps.length < 2) return toast('Scena jest za krótka, żeby wymienić zakończenie.', true);
  const { shortTail } = detectTics(sc.text, p);
  const cut = Math.min(ps.length - 1, shortTail >= 2 ? shortTail + 1 : (ps.length > 4 ? 2 : 1));
  const base = joinParas(ps.slice(0, ps.length - cut)), oldEnd = joinParas(ps.slice(ps.length - cut));
  const types = Object.keys(ENDINGS).filter(k => k !== sc.endingUsed).sort(() => Math.random() - .5).slice(0, 3);
  S.ui = { base, oldEnd, types, variants: [null, null, null], neutral: buildWriterMessages(p, sc, 'ending', { base }) };
  openSheet('Inne zakończenia', `<span class="hint">Wymieniam ostatnie ${cut === 1 ? 'akapit' : cut + ' akapity'}. Każdy wybór uczy przyszły model, czego nie lubisz.</span><div id="varList">${variantsHtml()}</div>`);
  await Promise.allSettled(types.map(async (t, i) => {
    try {
      const r = await llm('writer', buildWriterMessages(p, sc, 'ending', { base, ending: t }), { maxTokens: 4000 });
      S.ui.variants[i] = { text: cleanOutput(r.text) };
    } catch (e) { S.ui.variants[i] = { err: e.message }; }
    const vl = $('#varList'); if (vl) vl.innerHTML = variantsHtml();
  }));
};
function variantsHtml() {
  const u = S.ui;
  const cards = u.types.map((t, i) => {
    const v = u.variants[i];
    if (!v) return `<div class="variant"><span class="label">${ENDINGS[t].label}</span><div class="skel"></div></div>`;
    if (v.err) return `<div class="variant"><span class="label">${ENDINGS[t].label}</span><div class="banner bad small">${esc(v.err)}</div></div>`;
    return `<div class="variant"><span class="label">${ENDINGS[t].label}</span><p>${esc(v.text)}</p><button class="btn sm primary" data-a="pickEnding" data-id="${i}">Wybierz to</button></div>`;
  }).join('');
  return cards + `<div class="variant"><span class="label">Obecne zakończenie</span><p>${esc(u.oldEnd)}</p><button class="btn sm" data-a="pickEnding" data-id="old">Zostaw obecne</button></div>`;
}
A.pickEnding = id => {
  const u = S.ui, sc = curScene(), p = S.project;
  const opts = u.types.map((t, i) => u.variants[i]?.text ? { t, text: u.variants[i].text } : null).filter(Boolean);
  const chosen = id === 'old' ? u.oldEnd : u.variants[Number(id)]?.text; if (!chosen) return;
  const rejected = [...opts.map(o => o.text), u.oldEnd].filter(x => x !== chosen);
  for (const rj of rejected) p.dataset.dpo.push({ prompt: u.neutral, chosen, rejected: rj, at: Date.now() });
  if (id !== 'old') { pushHistory(sc); sc.text = u.base + '\n\n' + chosen; sc.endingUsed = u.types[Number(id)]; }
  saveProject(); closeSheet(); render(); toast(id === 'old' ? 'Zostawiono. Wybór zapisany do datasetu.' : 'Podmieniono zakończenie.');
};

// --- redakcja
A.editorPass = async () => {
  const sc = curScene(); const orig = sc.text;
  openSheet('Redakcja', loader(S.settings.lt ? 'LanguageTool i redaktor czytają scenę…' : 'Redaktor czyta scenę…'));
  let hints = '';
  if (S.settings.lt) {
    try {
      const m = await languageTool(orig);
      hints = m.slice(0, 60).map(x => `- „${x.ctx}”: ${x.msg}${x.rep.length ? ' → ' + x.rep.join(' / ') : ''}`).join('\n');
    } catch { /* LT niedostępny: idziemy dalej bez niego */ }
  }
  const user = (hints ? `Automatyczny korektor (LanguageTool) zgłosił możliwe problemy. Część zgłoszeń może być fałszywa, oceń je sam:\n${hints}\n\n` : '') + 'TEKST DO KOREKTY:\n\n' + orig;
  let r;
  try { r = await llm('editor', [{ role: 'system', content: EDITOR_SYS }, { role: 'user', content: user }]); }
  catch (e) { setSheet(`<div class="banner bad">${esc(e.message)}</div>`); throw e; }
  const fixed = cleanOutput(r.text);
  const ratio = fixed.length / Math.max(1, orig.length);
  const segs = diffHunks(orig, fixed);
  const n = segs.filter(s => s.eq == null).length;
  S.ui = { segs, orig };
  if (!n) return setSheet(`<div class="banner info">Redaktor nie znalazł nic do poprawy.</div><span class="hint mono">${esc(usageLine(r.usage))}</span>`);
  setSheet(`${ratio < 0.8 || ratio > 1.25 ? '<div class="banner warn"><b>Uwaga:</b> redaktor mocno zmienił długość tekstu. Przejrzyj zmiany dokładnie.</div>' : ''}
    <div class="row"><span class="grow"><b>${n}</b> ${n === 1 ? 'poprawka' : 'poprawek'}. Stuknij zmianę, żeby ją odrzucić.</span><button class="btn sm" data-a="hunksAll" data-id="1">Wszystkie</button><button class="btn sm" data-a="hunksAll" data-id="0">Żadne</button></div>
    <div class="diff" id="diffBox">${diffHtml()}</div>
    <span class="hint mono">${esc(usageLine(r.usage))}${hints ? ' · LanguageTool: ' + hints.split('\n').length + ' uwag' : ''}</span>
    <div class="sheet-foot"><button class="btn" data-a="closeSheet">Anuluj</button><button class="btn primary" data-a="applyHunks">Zastosuj zaznaczone</button></div>`);
};
function diffHtml() { return S.ui.segs.map((s, i) => s.eq != null ? esc(s.eq) : `<button class="hunk ${s.on ? '' : 'off'}" data-a="toggleHunk" data-id="${i}" aria-pressed="${s.on}">${s.del ? `<del>${esc(s.del)}</del>` : ''}${s.ins ? `<ins>${esc(s.ins)}</ins>` : ''}</button>`).join(''); }
A.toggleHunk = i => { const s = S.ui.segs[i]; s.on = !s.on; const b = $(`[data-a="toggleHunk"][data-id="${i}"]`); b.classList.toggle('off', !s.on); b.setAttribute('aria-pressed', s.on); };
A.hunksAll = v => { S.ui.segs.forEach(s => { if (s.eq == null) s.on = v === '1'; }); $('#diffBox').innerHTML = diffHtml(); };
A.applyHunks = () => { const sc = curScene(); pushHistory(sc); sc.text = applyHunks(S.ui.segs); saveProject(); closeSheet(); render(); toast('Poprawki zastosowane.'); };

A.accept = async () => {
  const sc = curScene();
  openSheet('Aktualizacja pamięci', loader('Archiwista czyta scenę i porównuje ją z kanonem…'));
  let r;
  try { r = await llm('memory', buildExtractMessages(S.project, sc), { json: true }); }
  catch (e) { setSheet(`<div class="banner bad">${esc(e.message)}</div>`); throw e; }
  const d = parseJSON(r.text);
  if (!d) return setSheet(`<div class="banner bad">Archiwista zwrócił coś, czego nie umiem odczytać. Spróbuj ponownie albo zmień model archiwisty.</div><pre class="ctx">${esc(r.text.slice(0, 3000))}</pre>`);
  S.ui = { x: normalizeExtract(d), sceneId: sc.id, usage: r.usage };
  setSheet(reviewHtml());
};
function normalizeExtract(d) {
  const arr = v => Array.isArray(v) ? v : [];
  return {
    summary: String(d.summary || ''),
    events: arr(d.events).filter(e => e && e.text),
    knowledge: arr(d.knowledge).filter(k => k && k.character && k.learned),
    character_updates: arr(d.character_updates).filter(k => k && k.character && k.change),
    new_characters: arr(d.new_characters).filter(c => c && c.name && !findChar(c.name)),
    threads_opened: arr(d.threads_opened).filter(t => t && t.text),
    threads_closed: arr(d.threads_closed).filter(t => t && S.project.threads.some(x => x.id === t.id && x.status === 'open')),
    continuity: arr(d.continuity).map(String).filter(s => s.trim()),
  };
}
function reviewHtml() {
  const x = S.ui.x;
  const box = (key, i, html) => `<label class="xitem"><input type="checkbox" data-x="${key}:${i}" checked><span class="x">${html}</span></label>`;
  const sec = (title, key, arr, fn) => arr.length ? `<div class="card"><div class="label">${title}</div>${arr.map((v, i) => box(key, i, fn(v))).join('')}</div>` : '';
  const thText = id => S.project.threads.find(t => t.id === id)?.text || id;
  return `${x.continuity.length ? `<div class="banner warn"><b>Możliwe błędy ciągłości</b>${x.continuity.map(c => '<div class="small">• ' + esc(c) + '</div>').join('')}<span class="small">Popraw scenę albo zatwierdź, jeśli to zamierzone.</span></div>` : ''}
  <div class="card"><div class="label">Streszczenie sceny</div><textarea class="auto" id="xSummary">${esc(x.summary)}</textarea></div>
  ${sec('Nowe wydarzenia', 'events', x.events, e => `${esc(e.text)}${e.consequence ? `<br><span class="muted small">→ ${esc(e.consequence)}</span>` : ''}${e.who?.length ? `<br><span class="small muted">${esc(e.who.join(', '))}</span>` : ''}${e.important ? ' <span class="tag warn">ważne</span>' : ''}`)}
  ${sec('Czego dowiedziały się postacie', 'knowledge', x.knowledge, k => `<b>${esc(k.character)}</b>: ${esc(k.learned)}`)}
  ${sec('Zmiany postaci', 'character_updates', x.character_updates, k => `<b>${esc(k.character)}</b>: ${esc(k.change)}`)}
  ${sec('Nowe postacie', 'new_characters', x.new_characters, c => `<b>${esc(c.name)}</b>: ${esc(c.description || '')}`)}
  ${sec('Nowe wątki', 'threads_opened', x.threads_opened, t => esc(t.text))}
  ${sec('Zamknięte wątki', 'threads_closed', x.threads_closed, t => `${esc(thText(t.id))}<br><span class="muted small">Rozwiązanie: ${esc(t.resolution || '')}</span>`)}
  <span class="hint mono">${esc(usageLine(S.ui.usage))}</span>
  <div class="sheet-foot"><button class="btn" data-a="closeSheet">Anuluj</button><button class="btn primary" data-a="applyExtract">Zapisz w pamięci</button></div>`;
}
function applyExtraction(sc, x, picked) {
  const p = S.project, ch = chapterOf(sc.id);
  const ok = (k, i) => !picked || picked.has(k + ':' + i);
  const ids = names => (names || []).map(n => findChar(n)?.id).filter(Boolean);
  x.new_characters.forEach((c, i) => { if (ok('new_characters', i)) p.characters.push({ id: uid('ch'), name: c.name.trim(), aliases: '', role: '', description: c.description || '', motivation: '', voice: '', relations: '', knows: [], unknown: '', changes: [] }); });
  // zastąp stare wpisy tej sceny, jeśli aktualizujemy ponownie
  p.events = p.events.filter(e => e.sceneId !== sc.id);
  x.events.forEach((e, i) => { if (ok('events', i)) p.events.push({ id: uid('e'), chapterId: ch.id, sceneId: sc.id, text: e.text, who: ids(e.who), consequence: e.consequence || '', important: !!e.important }); });
  const ci = chapterIndex(ch.id) + 1;
  x.knowledge.forEach((k, i) => { const c = findChar(k.character); if (c && ok('knowledge', i)) { c.knows = c.knows || []; const line = `${k.learned} (R${ci})`; if (!c.knows.includes(line)) c.knows.push(line); } });
  x.character_updates.forEach((k, i) => { const c = findChar(k.character); if (c && ok('character_updates', i)) { c.changes = c.changes || []; c.changes.push(`${k.change} (R${ci})`); } });
  x.threads_opened.forEach((t, i) => { if (ok('threads_opened', i)) p.threads.push({ id: uid('t'), text: t.text, who: ids(t.who), status: 'open', openedIn: ch.id }); });
  x.threads_closed.forEach((t, i) => { const th = p.threads.find(z => z.id === t.id); if (th && ok('threads_closed', i)) { th.status = 'closed'; th.resolution = t.resolution || ''; th.closedIn = ch.id; } });
  sc.summary = x.summary;
  sc.status = 'accepted';
  sc.tickEnding = S.project.tics.detect && detectTics(sc.text, p).tics.some(t => t.id !== 'zakazane');
  if (sc.gen && sc.gen.output !== sc.text) {
    p.dataset.sft = p.dataset.sft.filter(z => z.sceneId !== sc.id);
    p.dataset.sft.push({ sceneId: sc.id, messages: sc.gen.messages, output: sc.gen.output, final: sc.text, model: sc.gen.model, at: Date.now() });
  } else if (sc.gen) {
    p.dataset.sft = p.dataset.sft.filter(z => z.sceneId !== sc.id);
    p.dataset.sft.push({ sceneId: sc.id, messages: sc.gen.messages, output: sc.gen.output, final: sc.text, model: sc.gen.model, at: Date.now(), unchanged: true });
  }
}
A.applyExtract = () => {
  const sc = curScene() || S.project.chapters.flatMap(c => c.scenes).find(s => s.id === S.ui.sceneId);
  const picked = new Set($$('[data-x]').filter(i => i.checked).map(i => i.dataset.x));
  S.ui.x.summary = $('#xSummary')?.value || S.ui.x.summary;
  applyExtraction(sc, S.ui.x, picked);
  saveProject(); closeSheet(); render(); toast('Zapisano w pamięci.');
};

async function summarizeChapter(ch) {
  const body = ch.scenes.map(s => `${s.title}: ${s.summary || s.text.slice(0, 3000)}`).join('\n\n');
  if (!body.trim()) throw new UserError('Ten rozdział nie ma jeszcze treści.');
  const r = await llm('memory', [{ role: 'system', content: MEMORY_SYS.replace('Zwracasz WYŁĄCZNIE poprawny JSON.', '') }, { role: 'user', content: `Streść rozdział „${ch.title}” w 4–6 zdaniach: najważniejsze zdarzenia, zmiany w relacjach i to, z czym rozdział się kończy. Same fakty, bez ocen. Zwróć tylko streszczenie.\n\n${body}` }]);
  ch.summary = cleanOutput(r.text); saveProject(); render();
}
A.summarize = async (id, b) => { const ch = S.project.chapters.find(c => c.id === id); b.disabled = true; b.innerHTML = '<span class="spinner"></span>'; try { await summarizeChapter(ch); toast('Streszczono.'); } finally { render(); } };

A.importText = () => {
  openSheet('Wklej gotowy tekst', `<span class="hint">Wklej rozdział, który już masz. Sceny rozdziel linią z „***”. Archiwista przeczyta każdą scenę i zbuduje pamięć: postacie, wydarzenia, wątki.</span>
    <label class="field"><span>Tytuł rozdziału</span><input type="text" id="impTitle" value="Rozdział ${S.project.chapters.length + (curChapter().scenes.length ? 1 : 0)}"></label>
    <label class="field"><span>Tekst</span><textarea id="impText" style="min-height:40vh"></textarea></label>
    <label class="toggle"><span>Dodaj jako nowy rozdział</span><input type="checkbox" id="impNew" ${curChapter().scenes.length ? 'checked' : ''}></label>
    <div class="sheet-foot"><button class="btn primary" data-a="runImport">Importuj i zbuduj pamięć</button></div>`);
};
A.runImport = async () => {
  const p = S.project, txt = $('#impText').value.trim(); if (!txt) return toast('Wklej tekst.', true);
  let ch = curChapter();
  if ($('#impNew').checked) { ch = { id: uid('c'), title: $('#impTitle').value.trim() || 'Rozdział', summary: '', scenes: [] }; p.chapters.push(ch); }
  else if ($('#impTitle').value.trim()) ch.title = $('#impTitle').value.trim();
  p.currentChapter = ch.id;
  const parts = txt.split(/\n\s*(?:\*\s*){3}\s*\n|\n\s*#{1,3}\s*\n/).map(s => s.trim()).filter(Boolean);
  const scenes = parts.map((t, i) => { const s = newScene(ch.scenes.length + i + 1); s.text = t; s.status = 'draft'; return s; });
  ch.scenes.push(...scenes); saveProject();
  let done = 0, fails = 0;
  for (const s of scenes) {
    setSheet(loader(`Archiwista czyta scenę ${done + 1} z ${scenes.length}…`));
    try {
      s.who = p.characters.filter(c => mentions(s.text, c)).map(c => c.id);
      const r = await llm('memory', buildExtractMessages(p, s), { json: true });
      const d = parseJSON(r.text); if (!d) throw new Error('zły JSON');
      applyExtraction(s, normalizeExtract(d), null);
      s.who = p.characters.filter(c => mentions(s.text, c)).map(c => c.id);
    } catch (e) { fails++; console.warn(e); }
    done++; saveProject();
  }
  closeSheet(); render();
  toast(`Zaimportowano ${scenes.length} scen${fails ? `, ${fails} bez pamięci (spróbuj „Zaktualizuj pamięć” w scenie)` : ''}.`, !!fails);
};

async function saveFile(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare?.({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}

/* ============================== Książka ============================== */
const ORD1 = ['', 'pierwszy', 'drugi', 'trzeci', 'czwarty', 'piąty', 'szósty', 'siódmy', 'ósmy', 'dziewiąty', 'dziesiąty', 'jedenasty', 'dwunasty', 'trzynasty', 'czternasty', 'piętnasty', 'szesnasty', 'siedemnasty', 'osiemnasty', 'dziewiętnasty'];
const ORD10 = ['', '', 'dwudziesty', 'trzydziesty', 'czterdziesty', 'pięćdziesiąty', 'sześćdziesiąty', 'siedemdziesiąty', 'osiemdziesiąty', 'dziewięćdziesiąty'];
function ordinalPl(n) { if (n < 20) return ORD1[n]; if (n < 100) return ORD10[Math.floor(n / 10)] + (n % 10 ? ' ' + ORD1[n % 10] : ''); return String(n); }
function roman(n) { const m = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; }
const NUMBERING = { words: 'Rozdział pierwszy', arabic: 'Rozdział 1', roman: 'Rozdział I', bare: '1', none: 'Bez numeracji' };
function chapterLabel(n, mode) {
  if (mode === 'words') return 'Rozdział ' + ordinalPl(n);
  if (mode === 'arabic') return 'Rozdział ' + n;
  if (mode === 'roman') return 'Rozdział ' + roman(n);
  if (mode === 'bare') return String(n);
  return '';
}
// "Rozdział 3. Skrzynka" -> "Skrzynka"; "Rozdział 3" -> ""
const chapterSubtitle = t => (t || '').replace(/^\s*rozdział\s+(\d+|[ivxlcdm]+)(?![\p{L}])\.?\s*/iu, '').trim();

function typoPl(t, on) {
  if (!on) return t;
  let s = t
    .replace(/\.\.\./g, '…')
    .replace(/(^|\n)[ \t]*(-{1,2}|—)[ \t]+/g, '$1– ')
    .replace(/ (-{1,2}|—) /g, ' – ')
    .replace(/"([^"\n]+)"/g, '„$1”')
    .replace(/„([^„”\n]*)"/g, '„$1”');
  // sierotki: jednoliterowe wyrazy nie zostają na końcu wiersza
  for (let i = 0; i < 2; i++) s = s.replace(/(^|[\s(„])([aiouwzAIOUWZ]) /g, '$1$2\u00a0');
  return s;
}

function bookScenes(p, ch) {
  return ch.scenes.filter(s => s.text.trim() && !s.exclude && (!p.book.onlyAccepted || s.status === 'accepted'));
}
function bookStructure(p) {
  const out = []; let n = 0;
  p.chapters.forEach(ch => {
    const scenes = bookScenes(p, ch);
    if (ch.part?.trim()) out.push({ type: 'part', title: ch.part.trim() });
    if (!scenes.length) return;
    n++;
    const sub = chapterSubtitle(ch.title);
    const label = chapterLabel(n, p.book.numbering);
    out.push({ type: 'chapter', id: ch.id, n, label: label || sub || ch.title, title: label ? sub : '', scenes: scenes.map(s => splitParas(typoPl(s.text, p.book.typo))) });
  });
  return out;
}
function bookStats(p) {
  let words = 0, chars = 0;
  p.chapters.forEach(ch => bookScenes(p, ch).forEach(s => { words += wc(s.text); chars += s.text.replace(/\n+/g, ' ').length; }));
  return { words, chars, norm: chars / 1800, ark: chars / 40000, print: Math.ceil(chars / 2100) };
}

function bookHtml(p) {
  const b = p.book, st = bookStructure(p);
  let h = `<section class="front"><h1>${esc(p.title)}</h1>${b.subtitle ? `<div class="sub">${esc(b.subtitle)}</div>` : ''}${b.author ? `<div class="auth">${esc(b.author)}</div>` : ''}</section>`;
  if (b.dedication.trim()) h += `<div class="dedic">${esc(b.dedication).replace(/\n/g, '<br>')}</div>`;
  if (b.motto.trim()) h += `<div class="motto">${esc(b.motto).replace(/\n/g, '<br>')}${b.mottoSource ? `<br>— ${esc(b.mottoSource)}` : ''}</div>`;
  for (const x of st) {
    if (x.type === 'part') { h += `<div class="part">${esc(x.title)}</div>`; continue; }
    h += `<h2 id="bk_${x.id}">${esc(x.label)}</h2>${x.title ? `<div class="chap-sub">${esc(x.title)}</div>` : ''}`;
    x.scenes.forEach((paras, i) => {
      if (i) h += `<div class="sep">${esc(b.sep)}</div>`;
      h += paras.map(t => `<p>${esc(t)}</p>`).join('');
    });
  }
  if (!st.some(x => x.type === 'chapter')) h += `<p class="noind muted">Książka jest jeszcze pusta. Napisz pierwszą scenę.</p>`;
  return h;
}

function viewBook() {
  const p = S.project, b = p.book;
  if (S.bookMode === 'read') {
    const st = bookStructure(p).filter(x => x.type === 'chapter');
    return `<div class="row toc-jump"><button class="btn" data-a="bookMode" data-id="plan">← Plan książki</button>
      <select class="grow" id="tocJump" aria-label="Spis treści"><option value="">Spis treści</option>${st.map(x => `<option value="${x.id}">${esc(x.label)}${x.title ? ' · ' + esc(x.title) : ''}</option>`).join('')}</select></div>
      <article class="book" lang="pl">${bookHtml(p)}</article>`;
  }
  const s = bookStats(p);
  const pct = Math.min(100, Math.round(s.words / Math.max(1, b.target) * 100));
  let n = 0;
  const chs = p.chapters.map((ch, ci) => {
    const inBook = bookScenes(p, ch).length; if (inBook) n++;
    const label = inBook ? chapterLabel(n, b.numbering) : 'Poza książką (brak tekstu)';
    const sub = chapterSubtitle(ch.title);
    const rows = ch.scenes.map((sc, si) => {
      const off = sc.exclude || !sc.text.trim() || (b.onlyAccepted && sc.status !== 'accepted');
      const first = ci === 0 && si === 0, last = ci === p.chapters.length - 1 && si === ch.scenes.length - 1;
      return `<div class="sc-row ${off ? 'off' : ''}">
        <input type="checkbox" aria-label="Scena w książce" ${sc.exclude ? '' : 'checked'} data-a="toggleInBook" data-id="${sc.id}">
        <button class="nm" data-a="gotoScene" data-id="${sc.id}"><span>${esc(sc.title)}</span><span class="small muted">${fmtN(wc(sc.text))} sł. · ${sc.status === 'accepted' ? 'w pamięci' : 'szkic'}</span></button>
        <div class="mv"><button data-a="mvScene" data-id="${sc.id}:-1" aria-label="W górę" ${first ? 'disabled' : ''}>↑</button><button data-a="mvScene" data-id="${sc.id}:1" aria-label="W dół" ${last ? 'disabled' : ''}>↓</button></div></div>`;
    }).join('');
    return `${ch.part ? `<div class="part-label">${esc(ch.part)}</div>` : ''}<div class="card chap-card">
      <div class="ch-top"><div class="body"><span class="ch-num">${esc(label)}</span><span class="ch-title">${esc(sub || ch.title)}</span>
        <span class="small muted">${ch.scenes.length} scen · ${fmtN(ch.scenes.reduce((a, x) => a + wc(x.text), 0))} słów</span></div>
        <div class="mv"><button data-a="editChapterBook" data-id="${ch.id}" aria-label="Edytuj rozdział">✎</button><button data-a="mvChapter" data-id="${ch.id}:-1" aria-label="Rozdział w górę" ${ci === 0 ? 'disabled' : ''}>↑</button><button data-a="mvChapter" data-id="${ch.id}:1" aria-label="Rozdział w dół" ${ci === p.chapters.length - 1 ? 'disabled' : ''}>↓</button></div></div>
      ${rows || '<div class="sc-row"><span class="small muted">Brak scen</span></div>'}</div>`;
  }).join('');
  return `<h2 class="sec">Książka</h2>
  <div class="card">
    <div class="stats">
      <div class="stat"><b>${fmtN(s.words)}</b><span>słów z ${fmtN(b.target)} (${pct}%)</span></div>
      <div class="stat"><b>${fmtN(Math.round(s.norm))}</b><span>stron maszynopisu (1800 zn.)</span></div>
      <div class="stat"><b>${s.ark.toFixed(1).replace('.', ',')}</b><span>arkusza wydawniczego</span></div>
      <div class="stat"><b>~${fmtN(s.print)}</b><span>stron w druku (A5)</span></div>
    </div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="row"><button class="btn primary grow" data-a="bookMode" data-id="read">Czytaj jak książkę</button><button class="btn grow" data-a="bookExport">Eksportuj</button></div>
  </div>
  <div class="label">Spis treści</div>
  ${chs}
  <button class="btn" data-a="newChapterBook">Dodaj rozdział</button>
  <div class="card">
    <div class="label">Strona tytułowa</div>
    <label class="field"><span>Tytuł</span><input type="text" id="bkTitle" data-f="project.title" value="${esc(p.title)}"></label>
    <label class="field"><span>Podtytuł</span><input type="text" id="bkSub" data-f="book.subtitle" value="${esc(b.subtitle)}"></label>
    <label class="field"><span>Autor</span><input type="text" id="bkAuth" data-f="book.author" value="${esc(b.author)}"></label>
    <label class="field"><span>Dedykacja</span><textarea class="auto" id="bkDed" data-f="book.dedication" placeholder="Dla…">${esc(b.dedication)}</textarea></label>
    <label class="field"><span>Motto</span><textarea class="auto" id="bkMotto" data-f="book.motto">${esc(b.motto)}</textarea></label>
    <label class="field"><span>Źródło motta</span><input type="text" id="bkMottoSrc" data-f="book.mottoSource" value="${esc(b.mottoSource)}"></label>
    <label class="field"><span>Opis na okładkę (blurb)</span><textarea class="auto" id="bkBlurb" data-f="book.blurb">${esc(b.blurb)}</textarea></label>
    <button class="btn" data-a="writeBlurb">Napisz blurb z pamięci opowieści</button>
  </div>
  <div class="card">
    <div class="label">Skład</div>
    <label class="field"><span>Numeracja rozdziałów</span><select id="bkNum" data-f="book.numbering">${Object.entries(NUMBERING).map(([k, l]) => `<option value="${k}" ${b.numbering === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="field"><span>Separator scen</span><input type="text" id="bkSep" data-f="book.sep" value="${esc(b.sep)}"></label>
    <label class="field"><span>Cel (słowa)</span><input type="number" id="bkTarget" min="1000" step="1000" data-f="book.target" value="${b.target}"></label>
    <label class="toggle"><span>Polska typografia: „cudzysłowy”, półpauzy w dialogach, wielokropek, sierotki</span><input type="checkbox" id="bkTypo" data-f="book.typo" ${b.typo ? 'checked' : ''}></label>
    <label class="toggle"><span>Tylko sceny zatwierdzone (w pamięci)</span><input type="checkbox" id="bkOnly" data-f="book.onlyAccepted" ${b.onlyAccepted ? 'checked' : ''}></label>
  </div>`;
}

A.bookMode = m => { S.bookMode = m; render(); scrollTo(0, 0); };
A.gotoScene = id => { const ch = chapterOf(id); S.project.currentChapter = ch.id; S.sceneId = id; S.view = 'write'; saveProject(); render(); scrollTo(0, 0); };
A.toggleInBook = id => { const sc = S.project.chapters.flatMap(c => c.scenes).find(s => s.id === id); sc.exclude = !sc.exclude; saveProject(); render(); };
A.mvScene = arg => {
  const [id, d] = arg.split(':'); const dir = Number(d), p = S.project;
  const ci = p.chapters.findIndex(c => c.scenes.some(s => s.id === id)), ch = p.chapters[ci];
  const si = ch.scenes.findIndex(s => s.id === id), [sc] = ch.scenes.splice(si, 1);
  const ni = si + dir;
  if (ni < 0) { ch.scenes.splice(0, 0, sc); if (ci > 0) { ch.scenes.shift(); p.chapters[ci - 1].scenes.push(sc); } }
  else if (ni > ch.scenes.length) { if (ci < p.chapters.length - 1) p.chapters[ci + 1].scenes.unshift(sc); else ch.scenes.push(sc); }
  else ch.scenes.splice(ni, 0, sc);
  saveProject(); render();
};
A.mvChapter = arg => {
  const [id, d] = arg.split(':'); const p = S.project, i = p.chapters.findIndex(c => c.id === id), j = i + Number(d);
  if (j < 0 || j >= p.chapters.length) return;
  [p.chapters[i], p.chapters[j]] = [p.chapters[j], p.chapters[i]]; saveProject(); render();
};
A.editChapterBook = id => {

  openSheet('Rozdział', `<label class="field"><span>Tytuł rozdziału</span><input type="text" id="cbTitle" value="${esc(ch.title)}" placeholder="Np. Skrzynka"></label>

A.writeBlurb = async (id, b) => {

    const chars = p.characters.map(c => `- ${c.name}: ${c.role} ${c.description}`).join('\n');
    const r = await llm('writer', [{ role: 'system', content: 'Jesteś redaktorem polskiego wydawnictwa. Piszesz teksty na czwartą stronę okładki: konkretne, z haczykiem, bez spoilerów zakończenia, bez frazesów reklamowych typu „porywająca opowieść”.' },
      { role: 'user', content: `Tytuł: ${p.title}\nStyl: ${p.style.guide}\nPostacie:\n${chars}\nStreszczenia rozdziałów:\n${sums}\n\nNapisz blurb na okładkę, 90–140 słów, po polsku. Zwróć tylko tekst.` }], { maxTokens: 3000 });

};
