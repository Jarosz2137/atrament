<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atrament</title>
<meta name="description" content="Atrament by Egzey DevCorp. Pisanie opowieści z AI, które pamięta postacie i wydarzenia.">
<meta name="author" content="Egzey DevCorp">
<meta name="theme-color" content="#0F1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Atrament">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: aplikacja mobilna — przyklejony nagłówek, przewijana treść w kolumnie ~680px, dolny pasek zakładek. */
:root {
  --bg: #EEF0F3;
  --surface: #FFFFFF;
  --surface2: #E3E7ED;
  --fg: #151922;
  --muted: #5B6474;
  --line: #D2D8E0;
  --accent: #2E43B0;
  --accent-fg: #FFFFFF;
  --accent-soft: #DCE2FA;
  --warn: #8A5200;
  --warn-bg: #FFF0D2;
  --ok: #19704A;
  --ok-bg: #DAF2E4;
  --bad: #B02A1C;
  --bad-bg: #FCE3DF;
  --ins: #12663F;
  --ins-bg: #D3F0DF;
  --del: #A1281A;
  --del-bg: #FADBD6;
  --prose: 'Literata', Georgia, 'Times New Roman', serif;
  --ui: 'IBM Plex Sans', -apple-system, system-ui, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 10px;
  --nav-h: 50px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1218; --surface: #171B23; --surface2: #222833; --fg: #E6E9EF; --muted: #97A0AF; --line: #2D3441;
    --accent: #95A8FF; --accent-fg: #0F1218; --accent-soft: #252E55;
    --warn: #F2B653; --warn-bg: #36280E; --ok: #63D49C; --ok-bg: #11301F; --bad: #FF8E7E; --bad-bg: #3A1813;
    --ins: #7FE0AE; --ins-bg: #143524; --del: #FF9C8E; --del-bg: #431A14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1218; --surface: #171B23; --surface2: #222833; --fg: #E6E9EF; --muted: #97A0AF; --line: #2D3441;
  --accent: #95A8FF; --accent-fg: #0F1218; --accent-soft: #252E55;
  --warn: #F2B653; --warn-bg: #36280E; --ok: #63D49C; --ok-bg: #11301F; --bad: #FF8E7E; --bad-bg: #3A1813;
  --ins: #7FE0AE; --ins-bg: #143524; --del: #FF9C8E; --del-bg: #431A14;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; min-height: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh; min-height: 100lvh;
  font: 15px/1.5 var(--ui);
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; } /* iOS nie zoomuje przy >=16px */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* Nagłówek */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--prose); font-weight: 600; font-size: 19px; letter-spacing: .01em; display: flex; flex-direction: column; line-height: 1.1; flex: none; }
.brand small { font-family: var(--ui); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; color: var(--muted); margin-top: 2px; }
.proj-btn {
  margin-left: auto; min-width: 0; max-width: 62%;
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.proj-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-btn::after { content: "▾"; color: var(--muted); font-size: 12px; }

/* Treść */
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* Dolny pasek */
.nav {
  position: fixed; left: 0; right: 0; bottom: calc(-1 * var(--vfix, 0px)); z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: max(4px, calc(env(safe-area-inset-bottom, 0px) - 14px));
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav button {
  background: none; border: 0; cursor: pointer; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 500; letter-spacing: .02em; padding-top: 4px;
}
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); }

/* Elementy */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 160px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
h2.sec { font-family: var(--prose); font-size: 21px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 13px; font-weight: 500; color: var(--muted); }
input[type=text], input[type=password], input[type=url], input[type=number], input[type=search], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-width: 0;
}
textarea { resize: vertical; line-height: 1.5; min-height: 84px; }
select { appearance: none; -webkit-appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 9px 14px; cursor: pointer; font-weight: 500; font-size: 14.5px; min-height: 40px; white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.wrap { white-space: normal; text-align: left; justify-content: flex-start; height: auto; max-width: 100%; padding-inline: 0; line-height: 1.35; }
.btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13.5px; }
.icon-btn { background: none; border: 0; font-size: 26px; line-height: 1; padding: 4px 8px; cursor: pointer; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.acc { background: var(--accent-soft); color: var(--accent); }

.banner { border-radius: var(--r); padding: 11px 13px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--fg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.warn b { color: var(--warn); }
.banner.info { background: var(--accent-soft); }
.banner.bad { background: var(--bad-bg); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 7px 4px; font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .t { font-weight: 600; }
.item .d { font-size: 14px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.item .side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.empty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 14px; }
.chap-head { padding: 8px 14px; background: var(--surface2); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Edytor prozy */
.prose {
  font-family: var(--prose); font-size: 18px; line-height: 1.7; min-height: 46vh;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 20px;
  font-variation-settings: "opsz" 16; overflow: hidden; resize: none;
}
.prose.streaming { border-color: var(--accent); }
input.scene-title { font-family: var(--prose); font-size: 20px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); padding: 8px 11px; border-radius: 8px; }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
details.plan, details.adv { display: block; }
details.adv > summary { list-style: none; cursor: pointer; display: flex; align-items: center; }
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary::after { content: "Pokaż"; margin-left: auto; font-size: 13px; color: var(--accent); }
details.adv[open] > summary::after { content: "Ukryj"; }
details.plan > .stack { margin-top: 12px; gap: 12px; }
details.plan > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
details.plan > summary::-webkit-details-marker { display: none; }
details.plan > summary::after { content: "Zwiń"; margin-left: auto; font-size: 13px; color: var(--accent); }
details.plan:not([open]) > summary::after { content: "Rozwiń"; }

/* Arkusz (bottom sheet) */
#sheet { position: fixed; inset: 0 0 calc(-1 * var(--vfix, 0px)); z-index: 50; }
#manual { position: fixed; inset: 0; z-index: 70; }
#manual .sheet-panel { max-height: 92vh; }
#manual textarea { width: 100%; min-height: 120px; }
#manual .mprompt { max-height: 22vh; overflow: auto; font-size: 12px; white-space: pre-wrap; opacity: .75; }
.sheet-bg { position: absolute; inset: 0; background: rgb(5 8 14 / .5); }
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px);
  background: var(--surface); border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); max-width: 760px; margin: 0 auto;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet-panel { animation: none; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-family: var(--prose); font-size: 19px; font-weight: 600; flex: 1; min-width: 0; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet-foot { position: sticky; bottom: -18px; background: var(--surface); padding: 10px 0 4px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 4px; }
.sheet-foot .btn { flex: 1 1 130px; }

/* Diff */
.diff { font-family: var(--prose); font-size: 17px; line-height: 1.75; white-space: pre-wrap; word-wrap: break-word; background: var(--bg); border-radius: var(--r); padding: 14px; }
.hunk { display: inline; border: 0; padding: 0 1px; margin: 0; background: none; font: inherit; cursor: pointer; border-radius: 3px; text-align: left; }
.hunk del { background: var(--del-bg); color: var(--del); text-decoration: line-through; }
.hunk ins { background: var(--ins-bg); color: var(--ins); text-decoration: none; }
.hunk.off del { text-decoration: none; background: transparent; color: inherit; }
.hunk.off ins { display: none; }
.hunk:focus-visible { outline: 2px solid var(--accent); }

.variant { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.variant p { margin: 0; font-family: var(--prose); font-size: 16.5px; line-height: 1.65; white-space: pre-wrap; }
.skel { height: 74px; border-radius: 8px; background: linear-gradient(90deg, var(--surface2), var(--bg), var(--surface2)); background-size: 200% 100%; animation: sh 1.3s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

.xitem { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.xitem:first-of-type { border-top: 0; }
.xitem input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.xitem .x { flex: 1; min-width: 0; font-size: 14.5px; }
pre.ctx { white-space: pre-wrap; word-wrap: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.5; background: var(--bg); padding: 12px; border-radius: 8px; margin: 0; max-height: 60vh; overflow: auto; }

.toggle { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(1turn); } }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px - var(--vfix, 0px)); z-index: 60;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 520px); box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
#toast.bad { background: var(--bad); color: #fff; }
.model-row { display: flex; flex-direction: column; gap: 2px; padding: 10px 2px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; width: 100%; }
.model-row .mono { color: var(--muted); }
a { color: var(--accent); }

.mchips { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.mchip { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mchip b { font-weight: 600; font-size: 14.5px; }
.mchip span { font-size: 12.5px; color: var(--muted); }
.mchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
/* Książka */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--prose); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.chap-card { padding: 0; gap: 0; overflow: hidden; }
.chap-card .ch-top { display: flex; gap: 8px; align-items: flex-start; padding: 12px 12px 10px 14px; }
.chap-card .ch-top .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ch-num { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.ch-title { font-family: var(--prose); font-size: 17px; font-weight: 600; }
.part-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 2px 0; }
.mv { display: flex; gap: 2px; flex: none; }
.mv button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 15px; line-height: 1; color: var(--muted); }
.mv button[disabled] { opacity: .35; pointer-events: none; }
.sc-row { display: flex; gap: 8px; align-items: center; padding: 8px 12px 8px 14px; border-top: 1px solid var(--line); }
.sc-row .nm { flex: 1; min-width: 0; background: none; border: 0; text-align: left; cursor: pointer; padding: 4px 0; display: flex; flex-direction: column; }
.sc-row .nm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-row.off .nm { opacity: .45; text-decoration: line-through; }
.sc-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

.book { font-family: var(--prose); font-size: 18.5px; line-height: 1.7; hyphens: auto; -webkit-hyphens: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 22px 40px; }
.book p { margin: 0; text-indent: 1.4em; text-align: justify; }
.book .noind, .book h2 + p, .book .sep + p, .book .chap-sub + p { text-indent: 0; }
.book .front { text-align: center; padding: 40px 0 70px; display: flex; flex-direction: column; gap: 10px; }
.book .front h1 { font-size: 34px; line-height: 1.2; font-weight: 600; }
.book .front .sub { font-style: italic; color: var(--muted); }
.book .front .auth { margin-top: 18px; letter-spacing: .12em; text-transform: uppercase; font-size: 15px; }
.book .dedic { text-align: center; font-style: italic; padding: 30px 0; }
.book .motto { text-align: right; font-style: italic; padding: 10px 0 40px; max-width: 30em; margin-left: auto; }
.book .part { text-align: center; padding: 70px 0; font-size: 24px; font-weight: 600; letter-spacing: .04em; }
.book h2 { text-align: center; font-size: 15px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; margin: 64px 0 4px; }
.book .chap-sub { text-align: center; font-size: 23px; font-weight: 600; margin: 0 0 30px; text-wrap: balance; }
.book .sep { text-align: center; margin: 20px 0; letter-spacing: .3em; color: var(--muted); }
.toc-jump { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 5; }

#print { display: none; }
@media print {
  @page { size: A5; margin: 18mm 16mm 20mm; }
  body { background: #fff; color: #000; padding: 0; }
  body::before, .top, .nav, main, #sheet, #toast { display: none !important; }
  #print { display: block; }
  #print .book { border: 0; padding: 0; background: #fff; color: #000; font-size: 10.5pt; line-height: 1.45; }

async function llmRaw(role, messages, opt = {}) {
  const st = S.settings, r = st.roles[role];
  if (r.provider === 'manual') return manualAsk(role, messages, opt);
  if (r.provider === 'anthropic') return llmAnthropic(role, messages, opt);

  const isOR = r.provider === 'openrouter', isOA = r.provider === 'openai';
  const base = (P.base || st.customBase || '').trim().replace(/\/+$/, '');
  const key = (st[P.keyField] || '').trim();
  if (P.base && !key) throw new UserError('Brak klucza ' + P.name + '. Dodaj go w Ustawieniach.');
  if (!base) throw new UserError('Brak adresu własnego endpointu. Uzupełnij go w Ustawieniach.');
  if (!r.model) throw new UserError('Nie wybrano modelu dla roli: ' + ROLE_INFO[role].name + '.');

  const body = { model: r.model, messages, temperature: opt.temp ?? r.temp, stream: !!opt.stream };
  if (opt.maxTokens) body[isOA ? 'max_completion_tokens' : 'max_tokens'] = opt.maxTokens;
  if (isOA && opt.stream) body.stream_options = { include_usage: true };
  if (opt.json) body.response_format = { type: 'json_object' };
  if (isOR) {
    body.provider = {};
    if (st.denyTraining) body.provider.data_collection = 'deny';
    if (st.zdr) body.provider.zdr = true;
    if (role === 'writer') body.reasoning = st.reasoning === 'off' ? { enabled: false } : { effort: st.reasoning, exclude: true };
    body.usage = { include: true };
  }
  const headers = { 'Content-Type': 'application/json' };
  if (key) headers.Authorization = 'Bearer ' + key;
  if (isOR) { headers['HTTP-Referer'] = location.origin; headers['X-Title'] = 'Atrament'; }

  const send = b => fetch(base + '/chat/completions', { method: 'POST', headers, body: JSON.stringify(b), signal: opt.signal });
  let res;
  try { res = await send(body); }
  catch (e) { if (e.name === 'AbortError') throw e; throw new UserError('Brak połączenia z ' + P.name + '. Sprawdź internet' + (P.base ? '.' : ' i czy endpoint pozwala na zapytania z przeglądarki (CORS).')); }
  for (let tries = 0; res.status === 400 && tries < 3; tries++) {
    // część modeli nie zna niektórych parametrów: usuń ten, na który narzeka, i ponów
    const t = await res.clone().text().catch(() => '');
    let changed = false;
    if (/temperature/i.test(t) && 'temperature' in body) { delete body.temperature; changed = true; }
    if (/max_tokens/i.test(t) && body.max_tokens) { body.max_completion_tokens = body.max_tokens; delete body.max_tokens; changed = true; }
    if (/response_format|json/i.test(t) && body.response_format) { delete body.response_format; changed = true; }
    if (/reasoning/i.test(t) && body.reasoning) { delete body.reasoning; changed = true; }
    if (/stream_options/i.test(t) && body.stream_options) { delete body.stream_options; changed = true; }
    if (!changed && (body.reasoning || body.response_format)) { delete body.reasoning; delete body.response_format; changed = true; }
    if (!changed) break;
    res = await send(body);
  }
  // przeciążenie po stronie dostawcy: odczekaj i ponów (2 s, potem 6 s)
  for (const wait of [2000, 6000]) {
    if (![500, 502, 503, 504, 529].includes(res.status)) break;
    toast('Serwer modelu przeciążony, ponawiam za chwilę…');
    await new Promise(r => setTimeout(r, wait));
    res = await send(body);
  }
  if (!res.ok) throw httpError(res.status, await res.text().catch(() => ''));

  let text = '', usage = null, finish = '';
  if (opt.stream && res.body) {
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim();
        if (!d || d === '[DONE]') continue;
        let j; try { j = JSON.parse(d); } catch { continue; }
        if (j.error) throw new UserError('Model przerwał: ' + (j.error.message || 'nieznany błąd'));

        if (c) { text += c; opt.onDelta?.(text); }
        if (j.choices?.[0]?.finish_reason) finish = j.choices[0].finish_reason;

    if (j.error) throw new UserError('Model zwrócił błąd: ' + (j.error.message || ''));

    finish = j.choices?.[0]?.finish_reason || '';
    usage = j.usage || null;
  }
  if (usage?.cost) { st.spent = (st.spent || 0) + usage.cost; saveSettings(); }

}

  const endM = after.match(/[.!?…]["”»]?(?=\s|$)|\n/);
  const end = endM ? off + len + endM.index + (endM[0] === '\n' ? 0 : endM[0].length) : text.length;

function wordSet(t) { return new Set(((t || '').toLowerCase().match(/\p{L}{5,}/gu) || []).map(w => w.slice(0, 6))); }
function overlap(a, b) { let n = 0; for (const x of a) if (b.has(x)) n++; return n; }

function scenesBefore(p, sc) {
  const out = [];
  for (const c of p.chapters) for (const s of c.scenes) { if (s.id === sc.id) return out; out.push({ c, s }); }
  return out;
}
function relevantEvents(p, sc, present, limit = 24) {
  const q = wordSet(sc.plan + ' ' + sc.title);
  const evs = p.events.map((e, i) => {
    let score = 0;
    for (const id of e.who || []) if (present.includes(id)) score += 3;
    score += overlap(wordSet(e.text + ' ' + (e.consequence || '')), q);
    if (e.important) score += 2;
    score += i / Math.max(1, p.events.length);
    return { e, i, score };
  });
  const last = new Set(evs.slice(-5).map(x => x.i));
  const picked = evs.filter(x => !last.has(x.i)).sort((a, b) => b.score - a.score).slice(0, limit - last.size);
  const all = [...picked, ...evs.filter(x => last.has(x.i))].sort((a, b) => a.i - b.i);
  return all.map(x => x.e);
}
function relevantThreads(p, sc, present, limit = 12) {
  const q = wordSet(sc.plan);
  return p.threads.filter(t => t.status === 'open')
    .map(t => ({ t, s: (t.who || []).filter(id => present.includes(id)).length * 3 + overlap(wordSet(t.text), q) }))
    .sort((a, b) => b.s - a.s).slice(0, limit).map(x => x.t);
}
function charCard(c, full, lean = 0) {
  const L = [`### ${c.name}${c.aliases ? ' (' + c.aliases + ')' : ''}${c.role ? ' — ' + c.role : ''}`];
  if (c.description) L.push('Kim jest: ' + c.description);
  if (full) {
    if (c.motivation) L.push('Motywacja: ' + c.motivation);
    if (c.voice) L.push('Sposób mówienia: ' + c.voice);
    if (c.relations) L.push('Relacje: ' + c.relations);
    if (c.changes?.length) L.push('Co się z nią już stało (fakty z wcześniejszych scen): ' + c.changes.slice(lean ? -4 : -8).join('; '));
    if (c.knows?.length) L.push('WIE: ' + c.knows.slice(lean ? -6 : -15).join('; '));
    L.push('NIE WIE (nie może się tym posługiwać ani o tym wspominać): ' + (c.unknown || 'niczego, czego sama nie widziała ani nie usłyszała w scenach, w których była; nie zna ludzi, których nie poznała'));
    if ((c.arc || '').trim() && !lean) L.push('PLAN AUTORA NA PRZYSZŁOŚĆ (to się JESZCZE NIE wydarzyło; nie pisz tego jako faktu; prowadź fabułę powoli w tę stronę, nie przeskakuj do tego): ' + c.arc.trim());
  }
  return L.join('\n');
}
function evLine(p, e) {
  const ci = chapterIndex(e.chapterId);
  return `- [${ci >= 0 ? 'R' + (ci + 1) : '—'}] ${e.text}${e.consequence ? ' → ' + e.consequence : ''}`;
}
function lastEndings(p, sc, n = 3) {
  return scenesBefore(p, sc).filter(x => x.s.text).slice(-n).map(x => splitParas(x.s.text).slice(-2).join(' ').slice(-240));
}
function lastOpenings(p, sc, n = 3) {
  return scenesBefore(p, sc).filter(x => x.s.text).slice(-n).map(x => x.s.text.replace(/\s+/g, ' ').trim().slice(0, 200));
}
function trigrams(t) { const w = (t.toLowerCase().match(/\p{L}+/gu) || []).slice(0, 70); const set = new Set(); for (let i = 0; i + 2 < w.length; i++) set.add(w[i] + ' ' + w[i + 1] + ' ' + w[i + 2]); return set; }
function openingSimilar(p, sc) {
  const mine = trigrams(sc.text); if (mine.size < 8) return '';
  const cands = scenesBefore(p, sc).filter(x => x.s.text).slice(-5).map(x => ({ label: '„' + x.s.title + '”', t: x.s.text }));
  if (p.style.sample.trim()) cands.push({ label: 'próbka stylu', t: p.style.sample });
  for (const c of cands) { const o = trigrams(c.t); let k = 0; for (const x of mine) if (o.has(x)) k++; if (k / Math.min(mine.size, o.size || 1) > 0.2) return c.label; }
  // to samo pierwsze zdanie (pierwsze 6 słów)
  const head = t => (t.toLowerCase().match(/\p{L}+/gu) || []).slice(0, 6).join(' ');
  for (const c of cands) if (head(c.t) && head(c.t) === head(sc.text)) return c.label;
  return '';
}
function pickEnding(p, sc) {
  const recent = scenesBefore(p, sc).slice(-3).map(x => x.s.endingUsed).filter(Boolean);
  const pool = Object.keys(ENDINGS).filter(k => !recent.includes(k));
  return pool[Math.floor(Math.random() * pool.length)] || 'cliff';
}

const WRITER_SYS = `Jesteś współautorem powieści i piszesz po polsku jak doświadczony polski prozaik: naturalną, poprawną polszczyzną (odmiana, składnia, interpunkcja, aspekt czasowników), nie jak tłumaczenie.

// Realia dla pisarza: tylko linie związane z planem sceny. Linie „Typowe błędy…” są dla sprawdzania faktów, nie dla pisarza.
function relevantFacts(facts, q, max) {
  const out = []; let head = '';
  for (const raw of (facts || '').split('\n')) {
    const l = raw.trim(); if (!l) continue;
    if (/^#/.test(l)) { head = l.replace(/^#+\s*/, ''); continue; }
    if (/typowe błędy/i.test(l)) continue;
    const sc = overlap(wordSet(l), q); if (sc) out.push({ l, sc, head });
  }
  return out.sort((a, b) => b.sc - a.sc).slice(0, max).map(x => x.l.replace(/^[-*]\s*/, '- '));
}
// mode: 'full' (sprawdzanie ciągłości: wszystko), 'scene' (pisanie: tylko to, co potrzebne), 'ideas' (najkrócej)
function memoryBlock(p, sc, present, mode = 'full') {
  const full = mode === 'full', ideas = mode === 'ideas';
  const B = [];
  const q = wordSet(sc.plan + ' ' + (sc.where || '') + ' ' + sc.title);
  if (p.style.guide.trim()) B.push('## STYL I ŚWIAT\n' + p.style.guide.trim());
  if ((p.style.facts || '').trim()) {
    if (full) B.push('## REALIA I FAKTY TECHNICZNE (twarde fakty: trzymaj się ich dokładnie; gdy czegoś nie wiesz na pewno, nie podawaj konkretnych liczb)\n' + p.style.facts.trim());
    else if (!ideas) { const f = relevantFacts(p.style.facts, q, 6); if (f.length) B.push('## REALIA (tylko do sprawdzenia poprawności; NIE wplataj ich w tekst jako opisu ani wyjaśnień)\n' + f.join('\n')); }
  }
  if (p.style.sample.trim() && !ideas) B.push('## PRÓBKA STYLU AUTORA (naśladuj rytm i słownictwo; nie kopiuj treści, obrazów ani pierwszego zdania)\n' + p.style.sample.trim().slice(0, 7000));
  const pres = present.map(charById).filter(Boolean);
  if (pres.length) B.push('## POSTACIE W SCENIE\n' + pres.map(c => ideas ? charCard(c, false) : charCard(c, true, full ? 0 : 1)).join('\n\n'));
  const others = p.characters.filter(c => !present.includes(c.id));
  if (others.length) B.push('## INNE POSTACIE (tło)\n' + others.map(c => `- ${c.name}${c.role ? ': ' + c.role : ''}${c.description ? '. ' + c.description.slice(0, 120) : ''}`).join('\n'));
  // Historia: streszczenia poprzednich rozdziałów + scen bieżącego (przy pisaniu: dawne skrótem, ostatnie dokładnie)
  const ch = chapterOf(sc.id) || curChapter();
  const ci = chapterIndex(ch.id);
  const H = [];
  const keepChapters = full ? ci : Math.min(ci, 2);
  p.chapters.slice(ci - keepChapters, ci).forEach((c, k) => {
    const i = ci - keepChapters + k;
    const sum = c.summary || c.scenes.map(s => s.summary).filter(Boolean).join(' ');
    if (sum) H.push(`R${i + 1}. ${c.title}: ${full ? sum : sum.slice(0, 600)}`);
  });
  const before = ch.scenes.slice(0, ch.scenes.findIndex(s => s.id === sc.id));
  const recent = full ? before.length : (ideas ? 2 : 3);
  const older = before.slice(0, Math.max(0, before.length - recent)), last = before.slice(-recent);
  if (older.length && !full) { const t = older.map(s => s.title).join(', '); H.push(`R${ci + 1}, wcześniej (${t}): ` + (ch.summary ? ch.summary.slice(0, 500) : older.map(s => (s.summary || '').split(/(?<=\.)\s/)[0]).filter(Boolean).join(' '))); }
  last.forEach(s => { if (s.summary) H.push(`R${ci + 1}, ${s.title}: ${s.summary}`); });
  if (H.length) B.push('## HISTORIA DOTĄD\n' + H.join('\n'));
  const evs = relevantEvents(p, sc, present, full ? 24 : ideas ? 6 : 10);
  if (evs.length) B.push('## WAŻNE FAKTY I WYDARZENIA\n' + evs.map(e => evLine(p, e)).join('\n'));
  const th = relevantThreads(p, sc, present, full ? 12 : ideas ? 5 : 4);
  if (th.length) B.push('## OTWARTE WĄTKI (materiał do nawiązań; nie musisz rozwiązywać)\n' + th.map(t => '- ' + t.text).join('\n'));
  const banned = lines(p.banned);
  if (banned.length && !ideas) B.push('## ZAKAZANE\n' + banned.map(b => '- ' + b).join('\n'));
  const head = full ? '# PAMIĘĆ OPOWIEŚCI' : '# PAMIĘĆ OPOWIEŚCI\nTo jest tło do pilnowania spójności, a nie lista rzeczy do wpisania. Użyj tylko tego, czego wymaga plan sceny. Reszty nie wspominaj, nie streszczaj i nie nawiązuj do wszystkiego naraz.';
  return head + '\n\n' + B.join('\n\n');
}
function buildWriterMessages(p, sc, mode, extra = {}) {
  const present = sc.who || [];

  const prev = scenesBefore(p, sc).filter(x => x.s.text).slice(-1)[0];

  if (prev?.s.endState) parts.push('# STAN ŚWIATA NA KOŃCU POPRZEDNIEJ SCENY (kto gdzie jest; trzymaj się tego)\n' + prev.s.endState);
  const ends = lastEndings(p, sc);
  const starts = lastOpenings(p, sc);

  if (mode === 'scene') {

Napisz NOWĄ scenę „${sc.title}”. Cel długości: ok. ${sc.words} słów. Osiągaj go treścią, nie watą: rozpisz scenę na kilka wyraźnych etapów i nie streszczaj tego, co można pokazać. Nie dopychaj długości pustym dialogiem, powtórzeniami ani opisami bez funkcji. Jeśli scena naturalnie potrzebuje mniej, napisz mniej.

${jump ? 'CIĄGŁOŚĆ: ta scena NIE zaczyna się tam, gdzie skończyła się poprzednia. Jest przeskok w czasie lub miejscu. Nie wracaj do sytuacji z końca poprzedniej sceny, chyba że plan tego wymaga; najwyżej wspomnij jednym zdaniem, co się stało w międzyczasie, jeśli to potrzebne.' : 'CIĄGŁOŚĆ: scena może zaczynać się po poprzedniej, ale o tym, gdzie i co się dzieje, decyduje PLAN SCENY, a nie koniec poprzedniej sceny.'}

Postacie obecne: ${whoNames(present).join(', ') || 'według planu'}.
Zakończenie (${e.label}): ${e.ins}` + (ends.length ? `\nOstatnie sceny kończyły się tak. Nie kończ podobnie ani podobną konstrukcją:\n${ends.map(x => '- „' + x + '”').join('\n')}` : ''));
  } else if (mode === 'continue') {
    parts.push('# TEKST SCENY DO TEJ PORY\n' + sc.text + `\n\n# ZADANIE\nKontynuuj tę scenę dokładnie od miejsca, w którym się urywa (około 300–500 słów). Jeśli tekst kończy się w pół słowa albo w pół zdania, zacznij od brakującej części tego słowa lub zdania (np. tekst kończy się „gdzie Kac”, więc zaczynasz od „per znowu…”). Nie powtarzaj niczego, co już jest. Nie zaczynaj od nowego akapitu, jeśli zdanie nie jest skończone. Plan sceny: ${sc.plan.trim() || '—'}`);
  } else if (mode === 'ending') {

Format: każdy pomysł w osobnej linii, dokładnie tak:
TYTUŁ :: plan sceny w 2–3 zdaniach

  }

}
Nie dodawaj do "knowledge" ani "character_updates" niczego, co już jest zapisane przy postaci (nawet innymi słowami). "character_updates" to tylko trwałe, NOWE zmiany (relacja, decyzja, sytuacja), a nie powtarzanie, że ktoś „nadal” coś robi.
Wydarzenia: 2–8 najważniejszych faktów, nie opisy nastroju. "important": true tylko dla faktów, które będą miały znaczenie później. Nie dodawaj jako nowe postaci, które są już na liście znanych.`;
  return [{ role: 'system', content: MEMORY_SYS }, { role: 'user', content: user }];
}

/* ============================== Wykrywacz tików ============================== */
const ANAPHORA = /^((i|bo|a|ale)\s+)?to\s+(było|był|była|byli|były|jest|będzie|wystarcz\p{L}*)\b/iu;
const REFLECT = /(nic już nie (będzie|było)|po raz pierwszy od (dawna|lat)|w głębi (duszy|serca)|tak właśnie (miało|musiało)|wiedział(a)?, że (to|teraz|już))/iu;
function detectTics(text, p) {
  const out = [];
  const paras = splitParas(text);
  if (paras.length < 2) return { tics: out, shortTail: 0 };
  let shortTail = 0;
  for (let i = paras.length - 1; i >= Math.max(0, paras.length - 4); i--) {
    const s = paras[i];
    if (wc(s) <= 8 && !/^[„"–—-]/.test(s)) shortTail++; else break;
  }
  if (shortTail >= 2) out.push({ id: 'puenta', label: `Puenta na końcu: ${shortTail} krótkie akapity jeden pod drugim` });
  const tail = paras.slice(-3);
  const ana = tail.filter(s => ANAPHORA.test(s));
  if (ana.length) out.push({ id: 'anafora', label: 'Zakończenie typu „I to było…”: ' + ana.map(s => '„' + s.slice(0, 60) + '”').join(', ') });
  if (REFLECT.test(paras[paras.length - 1])) out.push({ id: 'refleksja', label: 'Refleksja narratora w ostatnim akapicie' });
  const low = text.toLowerCase();
  const hit = lines(p.banned).filter(b => low.includes(b.toLowerCase()));
  if (hit.length) out.push({ id: 'zakazane', label: 'Zakazane frazy: ' + hit.map(h => '„' + h + '”').join(', ') });
  return { tics: out, shortTail };
}
function endingTicCount(p, ch, exceptId) {
  return ch.scenes.filter(s => s.id !== exceptId && s.status === 'accepted' && s.tickEnding).length;
}

/* ============================== Diff słów ============================== */
function tokenize(s) { return s.match(/\s*\S+/g) || []; }
function lcsOps(a, b) {
  const n = a.length, m = b.length;
  if (n * m > 4e6) return [{ t: 'del', s: a.join('') }, { t: 'ins', s: b.join('') }];
  const W = m + 1, dp = new Uint32Array((n + 1) * W);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i * W + j] = a[i].trim() === b[j].trim() ? dp[(i + 1) * W + j + 1] + 1 : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
  const ops = []; let i = 0, j = 0;
  const push = (t, s) => { const l = ops[ops.length - 1]; if (l && l.t === t) l.s += s; else ops.push({ t, s }); };
  while (i < n && j < m) {
    if (a[i].trim() === b[j].trim()) { push('eq', b[j]); i++; j++; }
    else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { push('del', a[i]); i++; }
    else { push('ins', b[j]); j++; }
  }
  while (i < n) push('del', a[i++]);
  while (j < m) push('ins', b[j++]);
  return ops;
}
function diffHunks(orig, fixed) {
  const pa = splitParas(orig), pb = splitParas(fixed);
  let ops = [];
  if (pa.length === pb.length) {
    pa.forEach((x, k) => { if (k) ops.push({ t: 'eq', s: '\n\n' }); ops.push(...lcsOps(tokenize(x), tokenize(pb[k]))); });
  } else {
    ops = lcsOps(tokenize(joinParas(pa)), tokenize(joinParas(pb)));
  }
  // scal del+ins w hunki
  const segs = [];
  for (const o of ops) {
    if (o.t === 'eq') segs.push({ eq: o.s });
    else {
      let h = segs[segs.length - 1];
      if (!h || h.eq != null) { h = { del: '', ins: '', on: true }; segs.push(h); }
      h[o.t] += o.s;
    }
  }
  return segs;
}
function applyHunks(segs) { return segs.map(s => s.eq != null ? s.eq : (s.on ? s.ins : s.del)).join('').replace(/[ \t]+\n/g, '\n').trim(); }

function updateTicBanner() {
  const el = $('#ticBanner'); const sc = curScene(); if (!el || !sc) return;
  if (!S.project.tics.detect || GEN || !sc.text.trim()) { el.innerHTML = ''; return; }
  const { tics, shortTail } = detectTics(sc.text, S.project);
  const sim = openingSimilar(S.project, sc);
  if (sim) tics.unshift({ id: 'poczatek', label: 'Początek bardzo podobny do: ' + sim });
  if (!tics.length) { el.innerHTML = ''; return; }
  const ch = chapterOf(sc.id);
  const endingTic = tics.some(t => !['zakazane', 'poczatek'].includes(t.id));
  const used = endingTicCount(S.project, ch, sc.id);
  const over = endingTic && used >= S.project.tics.budget;
  el.innerHTML = `<div class="banner warn"><div><b>Wykryte tiki</b>${over ? ` · w tym rozdziale był już ${used} taki koniec (limit: ${S.project.tics.budget})` : ''}</div>
    <div class="stack small">${tics.map(t => '<div>• ' + esc(t.label) + '</div>').join('')}</div>
    <div class="row">${sim ? '<button class="btn sm" data-a="newOpening">Napisz inny początek</button>' : ''}${shortTail >= 2 ? '<button class="btn sm" data-a="cutTail">Utnij puentę</button>' : ''}${tics.some(t => !['zakazane', 'poczatek'].includes(t.id)) ? '<button class="btn sm" data-a="endings">Daj 3 inne zakończenia</button>' : ''}</div></div>`;
}

/* ============================== Edycja pól ============================== */
function scopeObj(scope) {
  if (scope === 'scene') return curScene();
  if (scope === 'project') return S.project;
  if (scope === 'style') return S.project.style;
  if (scope === 'tics') return S.project.tics;
  if (scope === 'book') return S.project.book;
  if (scope === 'settings') return S.settings;
  if (scope.startsWith('role_')) return S.settings.roles[scope.slice(5)];
  if (scope.startsWith('chap:')) return S.project.chapters.find(c => c.id === scope.slice(5));
  return null;
}
let ctxT = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.closest && el.closest('#sheet') && el.id !== 'modelSearch') SHEET_DIRTY = true;
  if (el.id === 'chapterSel') { S.project.currentChapter = el.value; saveProject(); render(); return; }
  if (el.id === 'evFilter') { S.evFilter = el.value; render(); return; }
  if (el.id === 'engineQuick') { const [eng, mid] = el.value.split(':'); S.settings.engine = eng; S.settings.pick = { ...(S.settings.pick || {}), [eng]: mid }; applyEngine(); toast('Pisze: ' + curEngineModel().name); return; }
  if (el.id === 'modelSearch') { renderModelList(el.value); return; }
  const f = el.dataset.f; if (!f) return;
  const dot = f.lastIndexOf('.'); const scope = f.slice(0, dot), key = f.slice(dot + 1);
  const obj = scopeObj(scope); if (!obj) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type === 'number' || el.type === 'range' || key === 'words') v = Number(v);
  obj[key] = v;
  if (el.classList.contains('auto')) autosize(el);
  if (scope === 'settings' || scope.startsWith('role_')) {
    if (scope === 'settings' && key === 'manualHelpers') { saveSettings(); applyEngine(); return; }
    saveSettings();
    if (scope === 'settings' && key === 'ghToken') { S.settings.gistId = ''; const b = $('[data-a="syncNow"]'); if (b) b.disabled = !v.trim(); setSyncState(''); }
    if (scope === 'settings' && /Key$/.test(key)) { clearTimeout(ctxT); ctxT = setTimeout(() => { const E = ENGINES[S.settings.engine]; if (E && PROVIDERS[E.prov].keyField === key && (E.prov === 'openai' || E.prov === 'gemini')) applyEngine(); }, 900); }
    if (el.type === 'range') { const t = $('#tv_' + scope.slice(5)); if (t) t.textContent = v; }
    if (key === 'provider') {
      const isClaude = /^claude-/.test(obj.model);
      if (v === 'anthropic' && !isClaude) obj.model = scope === 'role_memory' ? 'claude-haiku-5-5' : 'claude-sonnet-5-5';
      if (v === 'moonshot') obj.model = 'kimi-k3';
      if (v === 'gemini') obj.model = scope === 'role_memory' ? 'gemini-3.1-flash-lite' : 'gemini-3.8-flash';
      if (v === 'openai') obj.model = '';
      if (v === 'openrouter' && isClaude) obj.model = DEFAULT_SETTINGS.roles[scope.slice(5)].model;
      render();
    }
  } else saveProject();
  if (scope === 'project' && key === 'title') $('#projName').textContent = v;
  if (scope === 'scene' && key === 'text') updateTicBanner();
  if (scope === 'scene' && key === 'plan') {
    clearTimeout(ctxT); ctxT = setTimeout(() => { const c = $('#ctxSize'), sc = curScene(); if (c && sc) c.textContent = 'Kontekst: ~' + fmtN(estTok(buildWriterMessages(S.project, sc, 'scene', { ending: 'cliff' }).map(m => m.content).join(''))) + ' tokenów'; }, 400);
  }
});

/* ============================== Akcje ============================== */
let GEN = null;
const A = {};
A.manualCopy = async (id, b) => {
  if (!MANUAL) return;
  try { await navigator.clipboard.writeText(MANUAL.prompt); toast('Skopiowano. Wklej w czacie.'); if (b) b.textContent = 'Skopiowano ✓'; }
  catch { const v = $('#manualPromptView'); v?.closest('details')?.setAttribute('open', ''); const r = document.createRange(); r.selectNodeContents(v); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Nie mam dostępu do schowka. Prompt jest zaznaczony, skopiuj go ręcznie.', true); }
};
A.manualPaste = async () => {
  try { const t = await navigator.clipboard.readText(); if (t) $('#manualAnswer').value = t; else toast('Schowek jest pusty.', true); }
  catch { toast('Nie mam dostępu do schowka. Wklej odpowiedź w pole ręcznie.', true); $('#manualAnswer').focus(); }
};
A.manualDone = () => {
  if (!MANUAL) return;
  let t = ($('#manualAnswer').value || '').trim();
  if (!t) return toast('Wklej najpierw odpowiedź z czatu.', true);
  if (MANUAL.json && !parseJSON(t)) return toast('To nie wygląda na JSON. Skopiuj całą odpowiedź albo poproś czat o sam JSON.', true);
  if (!MANUAL.json) t = t.replace(/^```\w*\n?|\n?```$/g, '').replace(/^\*\*(.+?)\*\*$/gm, '$1').replace(/^#{1,6}\s+/gm, '');
  MANUAL.done(null, t);
};
A.manualCancel = () => { if (!MANUAL) return; const e = new Error('Anulowano.'); e.name = 'AbortError'; MANUAL.done(e); };
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const fn = A[b.dataset.a]; if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(b.dataset.id, b)).catch(toastErr);
});

// Zamykanie arkusza: jeśli coś w nim zmieniono, najpierw zapytaj, zamiast kasować wpisany tekst.
function askLeave() {
  const bar = $('#leaveBar'); if (!bar) return closeSheet();
  const canSave = !!$('#sheetBody [data-a^="save"]');
  bar.innerHTML = `<div class="banner warn" style="margin:10px 16px 0"><div><b>Masz niezapisane zmiany.</b> Zamknąć bez zapisywania?</div>
    <div class="row">${canSave ? '<button class="btn sm primary" data-a="leaveSave">Zapisz</button>' : ''}<button class="btn sm danger" data-a="forceClose">Wyrzuć zmiany</button><button class="btn sm" data-a="dismissLeave">Wróć do edycji</button></div></div>`;
}
A.closeSheet = () => SHEET_DIRTY ? askLeave() : closeSheet();
// Kliknięcie obok okna: okna z formularzem (postać, wydarzenie, wątek, wklejanie tekstu) się nie zamykają.
// Zamyka się je krzyżykiem, „Anuluj” albo „Zapisz”. Okna do samego czytania zamykają się jak dawniej.
const sheetHasForm = () => !!document.querySelector('#sheetBody input:not([type=search]):not([type=checkbox]), #sheetBody textarea');
A.sheetBg = () => { if (SHEET_DIRTY) return askLeave(); if (sheetHasForm()) { const p = $('.sheet-panel'); p?.animate?.([{ transform: 'translateY(0)' }, { transform: 'translateY(-6px)' }, { transform: 'translateY(0)' }], { duration: 180 }); return; } closeSheet(); };

A.leaveSave = () => { const b = $('#sheetBody [data-a^="save"]'); if (b) b.click(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) { e.preventDefault(); SHEET_DIRTY ? askLeave() : closeSheet(); } });

     ${x.id === S.project?.id ? '<span class="tag ok">otwarty</span>' : `<button class="btn sm" data-a="openProject" data-id="${x.id}">Otwórz</button>`}

A.createProject = async () => {
  const t = ($('#newProjTitle')?.value || '').trim() || 'Nowa opowieść';
  const p = newProject(t); S.project = p; S.sceneId = null; S.settings.lastProject = p.id; saveSettings();

  closeSheet(); S.view = 'style'; render(); toast('Utworzono. Zacznij od stylu i postaci.');
};
A.openProject = async id => {
  const p = await DB.get('p:' + id); if (!p) return toast('Nie znaleziono projektu.', true);
  S.project = migrate(p); S.sceneId = null; S.settings.lastProject = id; saveSettings(); closeSheet(); S.view = 'write'; render();
};
A.delProject = async (id, b) => {
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Na pewno?'; return; }
  await DB.del('p:' + id); S.projects = S.projects.filter(x => x.id !== id); await DB.set('projects', S.projects);
  if (S.settings.ghToken) { S.settings.syncDeleted = [...(S.settings.syncDeleted || []), id]; saveSettings(); scheduleSync(1500); }
  if (S.project?.id === id) {
    if (S.projects[0]) S.project = migrate(await DB.get('p:' + S.projects[0].id));
    else { const p = newProject('Nowa opowieść'); S.project = p; await DB.set('p:' + p.id, p); S.projects = [{ id: p.id, title: p.title, updated: p.updated }]; await DB.set('projects', S.projects); }
    S.sceneId = null;
  }
  A.openProjects(); render();
};

};
A.renameChapter = () => { curChapter().title = $('#chTitle').value.trim() || curChapter().title; saveProject(); closeSheet(); render(); };
A.newChapter = async () => {
  const p = S.project, prev = curChapter();
  const ch = { id: uid('c'), title: 'Rozdział ' + (p.chapters.length + 1), summary: '', scenes: [] };
  p.chapters.push(ch); p.currentChapter = ch.id; saveProject(); closeSheet(); render();
  if (prev.scenes.some(s => s.text) && !prev.summary) {
    toast('Streszczam poprzedni rozdział do pamięci…');
    try { await summarizeChapter(prev); toast('Poprzedni rozdział streszczony.'); } catch (e) { toastErr(e); }
  }
};

A.newScene = () => {
  const ch = curChapter(); const sc = newScene(ch.scenes.length + 1);

  ch.scenes.push(sc); S.sceneId = sc.id; saveProject(); render(); setTimeout(() => $('#scenePlan')?.focus(), 50);
};

// --- pisanie
async function streamInto(sc, messages, { append, quiet } = {}) {
  const prev = sc.text.replace(/\s+$/, '');
  // dopisywanie: jeśli tekst urywa się w pół słowa albo zdania, doklej bez nowego akapitu
  const joinTo = c => {
    if (!append) return c;
    if (/[.!?…"”»]$/.test(prev)) return prev + '\n\n' + c.replace(/^\s+/, '');
    if (/\p{L}$/u.test(prev) && /^\p{Ll}/u.test(c)) return prev + c;           // „Kac” + „per…”
    return prev + (/^[,.;:!?…]/.test(c) ? '' : ' ') + c.replace(/^\s+/, '');
  };
  GEN = { ctrl: new AbortController() };
  render();
  const ta = $('#sceneText');
  let follow = true;
  const onScroll = () => { follow = innerHeight + scrollY >= document.documentElement.scrollHeight - 160; };
  addEventListener('scroll', onScroll, { passive: true });
  try {
    const r = await llm('writer', messages, {
      stream: true, signal: GEN.ctrl.signal, maxTokens: Math.max(6000, (sc.words || 900) * 6), onDelta: full => {
        sc.text = joinTo(cleanOutput(full)); if (ta) { ta.value = sc.text; autosize(ta); }
        if (follow) scrollTo(0, document.documentElement.scrollHeight);
      }
    });
    sc.text = joinTo(cleanOutput(r.text));
    sc.usage = r.usage;
    if (quiet || cutOff(r, sc)) return r;
    if (r.finish === 'length') toast('Model doszedł do limitu długości odpowiedzi i urwał tekst. Użyj „Dopisz dalej”, dokończy od tego miejsca.', true);
    else if (r.finish === 'filter') toast('Dostawca modelu przerwał tekst filtrem treści. Spróbuj przeformułować plan albo zmień model.', true);
    else if (r.finish === 'none' && /\p{L}$/u.test(sc.text)) toast('Odpowiedź urwała się w pół słowa (zerwane połączenie?). Użyj „Dopisz dalej”.', true);
    return r;
  } catch (e) {
    if (e.name === 'AbortError') { toast('Zatrzymano.'); return null; }
    throw e;
  } finally {
    removeEventListener('scroll', onScroll);
    GEN = null; saveProject(); render();
  }
}
A.generate = async () => {
  if (GEN) return;
  const p = S.project, sc = curScene();
  if (!sc.who?.length) { const f = p.characters.filter(c => mentions(sc.plan, c)).map(c => c.id); if (f.length) sc.who = f; }
  const ending = sc.ending === 'auto' ? pickEnding(p, sc) : sc.ending;
  const messages = buildWriterMessages(p, sc, 'scene', { ending });
  pushHistory(sc); sc.text = ''; sc.endingUsed = ending; sc.status = 'draft';
  let r = await streamInto(sc, messages);
  r = await autoFinish(sc, r);
  if (r) { sc.gen = { messages, output: sc.text, model: r.model, at: Date.now() }; saveProject(); }
};
A.continue = async () => {
  if (GEN) return;
  const sc = curScene(); const messages = buildWriterMessages(S.project, sc, 'continue');
  pushHistory(sc);
  let r = await streamInto(sc, messages, { append: true });
  r = await autoFinish(sc, r);
  if (r && sc.gen) { sc.gen.output = sc.text; saveProject(); }
};
// Gdy odpowiedź urwie się w pół zdania (limit długości albo zerwane połączenie), dopisz resztę automatycznie, maks. 2 razy.
const cutOff = (r, sc) => r && (r.finish === 'length' || (r.finish === 'none' && !/[.!?…"”»]\s*$/.test(sc.text)));
async function autoFinish(sc, r) {
  for (let i = 0; i < 2 && cutOff(r, sc); i++) {
    toast('Tekst urwał się w pół zdania, dopisuję resztę…');
    r = await streamInto(sc, buildWriterMessages(S.project, sc, 'continue'), { append: true, quiet: true });
  }
  if (cutOff(r, sc)) toast(r.finish === 'length' ? 'Model dalej ucina odpowiedzi (limit długości). Zmień model albo dokończ ręcznie.' : 'Odpowiedź znowu się urwała. Sprawdź internet i nie wychodź z apki podczas pisania.', true);
  return r;
}
A.stop = () => GEN?.ctrl.abort();

A.cutTail = () => {
  const sc = curScene(); const { shortTail } = detectTics(sc.text, S.project); if (shortTail < 2) return;
  pushHistory(sc); const ps = splitParas(sc.text); sc.text = joinParas(ps.slice(0, ps.length - shortTail)); saveProject(); render(); toast('Ucięto końcową puentę.');
};

A.expand = async () => {
  if (GEN) return;
  const p = S.project, sc = curScene(), have = wc(sc.text);
  const msgs = buildWriterMessages(p, sc, 'scene', { ending: sc.endingUsed || 'cliff' });
  msgs[1].content += `\n\n# OBECNA WERSJA SCENY (${have} słów)\n${sc.text}\n\n# ZADANIE ZAMIAST POWYŻSZEGO\nScena jest krótsza niż cel (ok. ${sc.words} słów). Zwróć CAŁĄ scenę rozwiniętą TREŚCIĄ: pokaż to, co teraz jest streszczone, dodaj brakujące etapy z planu, napięcie, reakcje i konkretne szczegóły, które coś wnoszą (charakter, relacje, wątki). Nie dodawaj pustego dialogu, powtórzeń ani opisów bez funkcji: lepiej krótsza scena niż napompowana. Zachowaj wszystkie wydarzenia, kolejność, początek i zakończenie. Nie dopisuj nowego zakończenia ani podsumowania. Zwróć tylko tekst sceny.`;
  pushHistory(sc);
  const r = await streamInto(sc, msgs);
  if (r) { if (sc.gen) sc.gen.output = sc.text; toast(`Rozwinięto do ${fmtN(wc(sc.text))} słów.`); saveProject(); render(); }
};
const FACT_SYS = `Jesteś redaktorem merytorycznym powieści i konsultantem technicznym (motoryzacja, simracing, fizyka, realia polskie). Czytasz scenę zdanie po zdaniu i szukasz:
1. czynności fizycznie niemożliwych i sprzeczności w scenie (np. „gestykulował wolną ręką, nie zdejmując jej z kierownicy”; przedmiot odłożony, a potem trzymany w dłoni; postać, która wyszła, a nadal mówi w pokoju),
1b. zachowań, które nie mają sensu w danej sytuacji społecznej (np. obcy ludzie zostają sami w cudzym mieszkaniu, gdy gospodarz wychodzi i każe im wyjść; ktoś wchodzi do cudzego domu bez reakcji domownika; postać robi coś wbrew zdrowemu rozsądkowi bez powodu),
2. błędów merytorycznych, które przeoczyłby laik: pomieszane konteksty (gra a prawdziwe auto), złe lub brakujące jednostki, nierealne liczby, zbyt kategoryczne wnioski,
3. sprzeczności z kanonem i z tym, co postać może wiedzieć (pola WIE / NIE WIE),
4. błędnego użycia sprzętu, narzędzi i terminów fachowych z dziedziny, o której jest scena (np. przedmiot używany niezgodnie z przeznaczeniem, dane pozyskane w niemożliwy sposób): sprawdź każdy termin fachowy z sekcją REALIA i z własną wiedzą,
5. sceny wyraźnie niepełnej względem planu.
Typ zakończenia oceniasz łagodnie: zgłaszasz go tylko wtedy, gdy zakończenie wyraźnie nie ma nic wspólnego z zamówionym typem. Najważniejsze są punkty 1–4: najpierw je sprawdź. Nie oceniasz stylu ani gramatyki. Zwracasz WYŁĄCZNIE JSON.`;
A.factCheck = async () => {
  const p = S.project, sc = curScene(), present = sc.who || [];
  openSheet('Kontrola realiów', loader('Konsultant czyta scenę i sprawdza fakty…'));
  const e = sc.endingUsed ? ENDINGS[sc.endingUsed] : null;
  const user = `${memoryBlock(p, sc, present)}\n\n# WYMAGANIA SCENY\nPlan: ${sc.plan || '—'}\nCel długości: ok. ${sc.words} słów (jest ${wc(sc.text)}); zgłoś tylko, jeśli scena jest wyraźnie niepełna, a nie za samą liczbę słów.\n${e ? `Zamówione zakończenie (${e.label}): ${e.ins}` : ''}\n\n# SCENA\n${sc.text}\n\nZwróć JSON: {"issues":[{"quote":"dokładny cytat ze sceny (krótki)","problem":"co jest nie tak i dlaczego","fix":"jak to naprawić, konkretnie","rule":"ogólna zasada na przyszłość, jedno zdanie, żeby ten typ błędu się nie powtórzył (np. fakt o sprzęcie albo realiach)"}],"ending_ok":true,"ending_note":"czy zakończenie spełnia wymaganie; jeśli nie, dlaczego"}. Maksymalnie 8 najważniejszych problemów, od najpoważniejszych. Pusta lista, jeśli nie ma. Przy ending_ok domyślnie true.`;
  let r;
  try { r = await llm('writer', [{ role: 'system', content: FACT_SYS }, { role: 'user', content: user }], { json: true, maxTokens: 6000, temp: 0.2 }); }
  catch (err) { setSheet(`<div class="banner bad">${esc(err.message)}</div>`); throw err; }
  const d = parseJSON(r.text);
  if (!d) return setSheet(`<div class="banner bad">Konsultant zwrócił coś, czego nie umiem odczytać.</div><pre class="ctx">${esc(r.text.slice(0, 2000))}</pre>`);
  const issues = (Array.isArray(d.issues) ? d.issues : []).filter(i => i && i.problem);
  S.ui = { issues, endingOk: d.ending_ok !== false, endingNote: String(d.ending_note || '') };
  const endBox = !S.ui.endingOk ? `<div class="banner warn"><div><b>Zakończenie nie spełnia wymagania.</b> ${esc(S.ui.endingNote)}</div><div><button class="btn sm" data-a="endings">Daj 3 inne zakończenia</button></div></div>` : '';
  if (!issues.length) return setSheet(endBox + `<div class="banner info">Nie znalazłem błędów merytorycznych.</div><span class="hint mono">${esc(usageLine(r.usage))}</span>`);
  setSheet(`${endBox}<div class="card">${issues.map((i, k) => `<label class="xitem"><input type="checkbox" data-fx="${k}" checked><span class="x">${i.quote ? `<i>„${esc(i.quote)}”</i><br>` : ''}<b>${esc(i.problem)}</b>${i.fix ? `<br><span class="muted small">Poprawka: ${esc(i.fix)}</span>` : ''}${i.rule ? `<br><button class="btn sm ghost wrap" data-a="learnRule" data-id="${k}">Zapamiętaj w Realiach: „${esc(i.rule)}”</button>` : ''}</span></label>`).join('')}</div>
    <span class="hint mono">${esc(usageLine(r.usage))}</span>
    <div class="sheet-foot"><button class="btn" data-a="closeSheet">Zamknij</button><button class="btn primary" data-a="applyFacts">Popraw zaznaczone</button></div>`);
};

  const user = `TYTUŁ: ${p.title}\nWYTYCZNE: ${p.style.guide || '—'}\nPOSTACIE:\n${p.characters.map(c => `- ${c.name}: ${c.role} ${c.description}`).join('\n') || '—'}\nSTRESZCZENIA:\n${sums || '—'}\nFRAGMENTY:\n${sample || '—'}\nOBECNE REALIA:\n${p.style.facts || '—'}\n\nUstal, jakich dziedzin wiedzy dotyczy ta opowieść (zawody, sprzęt, technologie, miejsca, epoka, procedury). Dla każdej spisz 5–12 konkretnych, sprawdzonych faktów i typowych błędów, które popełnia autor bez wiedzy fachowej: jak naprawdę działa sprzęt i jak się go używa, poprawna terminologia, jednostki, realne liczby, czego nie da się zrobić. Pisz po polsku, krótko, jedna rzecz w linii, w formacie:\n## Dziedzina\n- fakt\nNie powtarzaj OBECNYCH REALIÓW. Jeśli czegoś nie jesteś pewien, pomiń to. Zwróć tylko listę.`;

  const user = `${(p.style.facts || '').trim() ? 'REALIA:\n' + p.style.facts.trim() + '\n\n' : ''}PROBLEMY DO NAPRAWIENIA:\n${list}\n\nSCENA:\n${orig}\n\nPopraw WYŁĄCZNIE miejsca związane z powyższymi problemami, minimalną zmianą (możesz dopisać krótkie zdanie wyjaśnienia, jeśli jest potrzebne). Reszta tekstu ma zostać słowo w słowo. Zachowaj podział na akapity. Zwróć cały tekst sceny i nic więcej.`;

  try { r = await llm('writer', [{ role: 'system', content: 'Jesteś redaktorem merytorycznym polskiej prozy. Wprowadzasz tylko wskazane poprawki.' }, { role: 'user', content: user }], { temp: 0.3 }); }
  catch (err) { setSheet(`<div class="banner bad">${esc(err.message)}</div>`); throw err; }

A.newOpening = async () => {
  if (GEN) return;
  const p = S.project, sc = curScene(), ps = splitParas(sc.text);
  if (ps.length < 3) return toast('Scena jest za krótka, żeby wymienić sam początek.', true);
  const cut = ps.length > 6 ? 2 : 1, rest = joinParas(ps.slice(cut));
  const msgs = buildWriterMessages(p, sc, 'scene', { ending: sc.endingUsed || 'cliff' });
  msgs[1].content += `\n\n# DALSZA CZĘŚĆ SCENY (zostaje bez zmian)\n${rest}\n\n# ZADANIE ZAMIAST POWYŻSZEGO\nNapisz WYŁĄCZNIE nowy początek tej sceny: ${cut === 1 ? 'jeden akapit' : 'dwa akapity'}, które płynnie prowadzą do dalszej części powyżej. Zacznij zupełnie inaczej niż poprzednie sceny i niż próbka stylu. Zwróć tylko ten początek.`;
  pushHistory(sc);
  GEN = { ctrl: new AbortController() }; render();
  try {
    const r = await llm('writer', msgs, { maxTokens: 3000, signal: GEN.ctrl.signal });
    sc.text = cleanOutput(r.text) + '\n\n' + rest; sc.usage = r.usage;
    toast('Nowy początek wstawiony. „Cofnij zmianę” przywróci poprzedni.');
  } catch (e) { if (e.name !== 'AbortError') toastErr(e); }
  finally { GEN = null; saveProject(); render(); }
};

A.endings = async () => {
  const p = S.project, sc = curScene();
  const ps = splitParas(sc.text);
  if (ps.length < 2) return toast('Scena jest za krótka, żeby wymienić zakończenie.', true);

// --- redakcja
// Redakcja: model nie przepisuje całej sceny (słabe modele odsyłają ją wtedy bez zmian), tylko zwraca listę
// konkretnych poprawek „znajdź → zamień”, a apka nanosi je sama. Scena idzie w kawałkach, żeby nic nie umknęło.
const EDITOR_JSON_SYS = `Jesteś bardzo dokładnym korektorem i redaktorem polskiej prozy. Czytasz fragment zdanie po zdaniu i wypisujesz KAŻDY błąd:
1. gramatyka i odmiana: zgodność przypadka, liczby i rodzaju w każdej frazie (np. „zamiast czystego pulpitów” → „zamiast czystych pulpitów”, „z wąskiego kręgów” → „z wąskiego kręgu”), złe formy, składnia,
2. ortografia i pisownia wyrażeń (np. „wczoraj popołudniu” → „wczoraj po południu”, „z resztą” → „zresztą”), literówki, interpunkcja,
3. logika wewnątrz zdania i między zdaniami: sprzeczności fizyczne i czynności niemożliwe naraz (np. „gestykulował wolną ręką, nie zdejmując jej z kierownicy”), przedmioty, które pojawiają się lub znikają bez sensu, kalki z angielskiego,
4. powtórzenia tego samego słowa w sąsiednich zdaniach.
Nie poprawiasz stylu, który jest poprawny. Nie zmieniasz fabuły ani treści dialogów poza błędami. Nie ruszasz nazw własnych, modeli aut, nicków i terminów technicznych (np. GT3, M4 F82, Stavelot, camber).
Zwracasz WYŁĄCZNIE JSON: {"fixes":[{"find":"dokładny fragment z tekstu, 3–15 słów, skopiowany znak w znak","replace":"ten sam fragment po poprawce","why":"krótko: rodzaj błędu"}]}. Jeśli nie ma błędów: {"fixes":[]}.`;
const CONTINUITY_SYS = `Jesteś redaktorem ciągłości. Czytasz CAŁĄ scenę od początku do końca i śledzisz stan świata: gdzie jest każda postać, w jakiej pozycji (siedzi, stoi), co trzyma w rękach i gdzie odłożyła przedmioty, co jest włączone lub otwarte (ekran, okno, stream, telefon), pora dnia, kto co wie i kto już wyszedł. Szukasz WYŁĄCZNIE sprzeczności rozciągniętych na kilka zdań lub akapitów (np. postać odkłada telefon, a później trzyma go w dłoni, choć go nie podniosła; wychodzi z pokoju i nagle w nim siedzi; zamyka okno, które potem znowu ogląda) oraz stanów końcowych bez sensu (np. gospodarz wychodzi z mieszkania, a goście, których wyprosił, zostają w nim sami). Gramatyki i stylu nie poprawiasz.
Zwracasz WYŁĄCZNIE JSON: {"fixes":[{"find":"dokładny fragment z tekstu, 3–15 słów, skopiowany znak w znak","replace":"ten fragment po minimalnej poprawce, która usuwa sprzeczność","why":"krótko: co się nie zgadza"}],"notes":["sprzeczność, której nie da się naprawić jednym fragmentem"]}. Jeśli wszystko się zgadza: {"fixes":[],"notes":[]}.`;
function protectedWords(p) {
  const set = new Set();
  const add = t => String(t || '').split(/[\n,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean).forEach(x => { set.add(x); x.split(/\s+/).forEach(y => set.add(y)); });
  add(p.dict);
  p.characters.forEach(c => { add(c.name); add(c.aliases); });
  return set;
}
function chunkParas(text, max = 2600) {
  const out = []; let cur = [];
  for (const p of splitParas(text)) { if (cur.length && (cur.join('\n\n').length + p.length) > max) { out.push(cur.join('\n\n')); cur = []; } cur.push(p); }
  if (cur.length) out.push(cur.join('\n\n'));
  return out;
}
A.editorPass = async () => {
  const sc = curScene(); const orig = sc.text;
  openSheet('Redakcja', loader('Korekta zdanie po zdaniu i kontrola ciągłości całej sceny…'));
  let lt = []; S.ltFailed = false;
  if (S.settings.lt) { try { lt = await languageTool(orig); } catch { S.ltFailed = true; } }
  const chunks = chunkParas(orig, isManual('editor') ? 1e9 : 2600);
  let usage = { prompt_tokens: 0, completion_tokens: 0, cost: 0 }, failed = 0, lastErr = null;
  // osobny przebieg ciągłości na całej scenie, równolegle z korektą kawałków
  const continuity = llm('editor', [{ role: 'system', content: CONTINUITY_SYS }, { role: 'user', content: 'SCENA:\n\n' + orig }], { json: true, temp: 0.1, maxTokens: 6000 })
    .then(r => { if (r.usage) { usage.prompt_tokens += r.usage.prompt_tokens || 0; usage.completion_tokens += r.usage.completion_tokens || 0; usage.cost += r.usage.cost || 0; } const d = parseJSON(r.text) || {}; return { fixes: (Array.isArray(d.fixes) ? d.fixes : []).map(f => ({ ...f, why: 'ciągłość: ' + (f?.why || '') })), notes: (Array.isArray(d.notes) ? d.notes : []).map(String).filter(x => x.trim()) }; })
    .catch(() => ({ fixes: [], notes: [], failed: true }));
  const runChunk = async ch => {
    const hints = lt.filter(x => ch.includes(x.bad)).slice(0, 30).map(x => `- „${x.ctx}”: ${x.msg}${x.rep.length ? ' → ' + x.rep.join(' / ') : ''}`).join('\n');
    const user = (hints ? `Automatyczny korektor (LanguageTool) zgłosił możliwe problemy. Część może być fałszywa, oceń sam:\n${hints}\n\n` : '') + 'FRAGMENT:\n\n' + ch;
    try {
      const r = await llm('editor', [{ role: 'system', content: EDITOR_JSON_SYS }, { role: 'user', content: user }], { json: true, temp: 0.1, maxTokens: 6000 });
      if (r.usage) { usage.prompt_tokens += r.usage.prompt_tokens || 0; usage.completion_tokens += r.usage.completion_tokens || 0; usage.cost += r.usage.cost || 0; }
      const d = parseJSON(r.text);
      return Array.isArray(d?.fixes) ? d.fixes : [];
    } catch (e) { throw e; }
  };
  // kawałki po kolei (darmowe klucze mają limity na minutę), z jedną ponowną próbą
  const results = [];
  for (const ch of chunks) {
    try { results.push(await runChunk(ch)); }
    catch (e) {
      await new Promise(r => setTimeout(r, 2500));
      try { results.push(await runChunk(ch)); } catch (e2) { failed++; lastErr = e2; results.push([]); }
    }
  }
  const cont = await continuity;
  if (failed === chunks.length && cont.failed) { setSheet(`<div class="banner bad">${esc(lastErr?.message || 'Redaktor nie odpowiedział.')}</div>`); return; }
  results.push(cont.fixes);
  const notesHtml = cont.notes.length ? `<div class="banner warn"><b>Ciągłość do sprawdzenia ręcznie</b>${cont.notes.map(x => '<div class="small">• ' + esc(x) + '</div>').join('')}</div>` : '';
  // naniesienie poprawek: każdą w pierwszym miejscu, gdzie pasuje dokładnie

  let fixed = orig; const applied = [], missed = [], ltNotes = [];

  const isProtected = x => {

    fixed = fixed.slice(0, x.off) + x.rep[0] + fixed.slice(x.off + x.len); lastStart = x.off;
    applied.push({ find: x.bad, replace: x.rep[0], why: 'LanguageTool: ' + x.msg });
  }
  for (const x of lt) if (!x.rep.length && !isProtected(x)) ltNotes.push(x);
  // 2) poprawki redaktora
  for (const f of results.flat()) {
    if (!f || typeof f.find !== 'string' || typeof f.replace !== 'string' || !f.find.trim() || f.find === f.replace) continue;
    if (fixed.includes(f.find)) { fixed = fixed.replace(f.find, f.replace); applied.push(f); }
    else { const loose = f.find.replace(/\s+/g, ' ').trim(); const idx = fixed.replace(/\s+/g, ' ').indexOf(loose); if (idx < 0) missed.push(f); else missed.push(f); }
  }
  const segs = diffHunks(orig, fixed), n = segs.filter(x => x.eq == null).length;
  S.ui = { segs, orig };
  const ltInfo = !S.settings.lt ? 'wyłączony' : S.ltFailed ? 'niedostępny' : lt.length + ' uwag';
  const ltNotesHtml = ltNotes.length ? `<details class="card"><summary class="label" style="cursor:pointer">Uwagi LanguageTool bez gotowej poprawki (${ltNotes.length})</summary><div class="stack small" style="margin-top:8px">${ltNotes.map(x => `<div><span class="muted">${esc(x.pre)}</span><b>${esc(x.bad)}</b><span class="muted">${esc(x.post)}</span><br>→ ${esc(x.msg)}</div>`).join('')}</div></details>` : '';
  const foot = `${ltNotesHtml}${failed ? `<div class="banner warn small">Redaktor nie sprawdził ${failed} z ${chunks.length} fragmentów: ${esc(lastErr?.message || '')}</div>` : ''}<span class="hint mono">${esc(usageLine(usage))} · fragmentów: ${chunks.length}${failed ? ` (nieudanych: ${failed})` : ''} · ciągłość całej sceny: ${cont.failed ? 'nie udała się' : 'sprawdzona'} · LanguageTool: ${ltInfo}</span>`;
  if (!n) return setSheet(`${notesHtml}<div class="banner info">Redaktor nie znalazł nic do poprawy.</div>${missed.length ? `<div class="banner warn small">Redaktor zgłosił ${missed.length} uwag, ale nie dało się ich dopasować do tekstu: ${missed.map(m => esc('„' + m.find + '” → „' + m.replace + '”')).join('; ')}</div>` : ''}${foot}`);

    <div class="diff" id="diffBox">${diffHtml()}</div>
    <details class="card"><summary class="label" style="cursor:pointer">Dlaczego (${applied.length})</summary><div class="stack small" style="margin-top:8px">${applied.map(a => `<div>„${esc(a.find)}” → „${esc(a.replace)}”${a.why ? ` <span class="muted">(${esc(a.why)})</span>` : ''}</div>`).join('')}</div></details>
    ${missed.length ? `<div class="hint">Nie dopasowano do tekstu: ${missed.length} uwag.</div>` : ''}
    ${foot}
    <div class="sheet-foot"><button class="btn" data-a="closeSheet">Anuluj</button><button class="btn primary" data-a="applyHunks">Zastosuj zaznaczone</button></div>`);
};

async function summarizeChapter(ch) {

}

A.runImport = async () => {
  const p = S.project, txt = $('#impText').value.trim(); if (!txt) return toast('Wklej tekst.', true);
  let ch = curChapter();
  if ($('#impNew').checked) { ch = { id: uid('c'), title: $('#impTitle').value.trim() || 'Rozdział', summary: '', scenes: [] }; p.chapters.push(ch); }
  else if ($('#impTitle').value.trim()) ch.title = $('#impTitle').value.trim();
  p.currentChapter = ch.id;
  const parts = txt.split(/\n\s*(?:\*\s*){3}\s*\n|\n\s*#{1,3}\s*\n/).map(s => s.trim()).filter(Boolean);
  const scenes = parts.map((t, i) => { const s = newScene(ch.scenes.length + i + 1); s.text = t; s.status = 'draft'; return s; });
  ch.scenes.push(...scenes); saveProject();
  let done = 0, fails = 0;
  for (const s of scenes) {
    setSheet(loader(`Archiwista czyta scenę ${done + 1} z ${scenes.length}…`));
    try {
      s.who = p.characters.filter(c => mentions(s.text, c)).map(c => c.id);
      const r = await llm('memory', buildExtractMessages(p, s), { json: true });
      const d = parseJSON(r.text); if (!d) throw new Error('zły JSON');
      applyExtraction(s, normalizeExtract(d), null);
      s.who = p.characters.filter(c => mentions(s.text, c)).map(c => c.id);
    } catch (e) { fails++; console.warn(e); }
    done++; saveProject();
  }
  closeSheet(); render();
  toast(`Zaimportowano ${scenes.length} scen${fails ? `, ${fails} bez pamięci (spróbuj „Zaktualizuj pamięć” w scenie)` : ''}.`, !!fails);
};

async function loadModels() {
  if (S.models) return S.models;
  const cached = await DB.get('models');
  if (cached && Date.now() - cached.at < 864e5) return (S.models = cached.list);
  const r = await fetch('https://openrouter.ai/api/v1/models');
  if (!r.ok) throw new UserError('Nie udało się pobrać listy modeli z OpenRouter.');
  const j = await r.json();
  const list = (j.data || []).filter(m => (m.architecture?.output_modalities || ['text']).includes('text')).map(m => ({
    id: m.id, name: m.name, ctx: m.context_length,
    pin: Number(m.pricing?.prompt || 0) * 1e6, pout: Number(m.pricing?.completion || 0) * 1e6,
  }));
  await DB.set('models', { at: Date.now(), list });
  return (S.models = list);
}

async function saveFile(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare?.({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}

/* ============================== Książka ============================== */
const ORD1 = ['', 'pierwszy', 'drugi', 'trzeci', 'czwarty', 'piąty', 'szósty', 'siódmy', 'ósmy', 'dziewiąty', 'dziesiąty', 'jedenasty', 'dwunasty', 'trzynasty', 'czternasty', 'piętnasty', 'szesnasty', 'siedemnasty', 'osiemnasty', 'dziewiętnasty'];
const ORD10 = ['', '', 'dwudziesty', 'trzydziesty', 'czterdziesty', 'pięćdziesiąty', 'sześćdziesiąty', 'siedemdziesiąty', 'osiemdziesiąty', 'dziewięćdziesiąty'];
function ordinalPl(n) { if (n < 20) return ORD1[n]; if (n < 100) return ORD10[Math.floor(n / 10)] + (n % 10 ? ' ' + ORD1[n % 10] : ''); return String(n); }
function roman(n) { const m = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; }
const NUMBERING = { words: 'Rozdział pierwszy', arabic: 'Rozdział 1', roman: 'Rozdział I', bare: '1', none: 'Bez numeracji' };
function chapterLabel(n, mode) {
  if (mode === 'words') return 'Rozdział ' + ordinalPl(n);
  if (mode === 'arabic') return 'Rozdział ' + n;
  if (mode === 'roman') return 'Rozdział ' + roman(n);
  if (mode === 'bare') return String(n);
  return '';
}
// "Rozdział 3. Skrzynka" -> "Skrzynka"; "Rozdział 3" -> ""
const chapterSubtitle = t => (t || '').replace(/^\s*rozdział\s+(\d+|[ivxlcdm]+)(?![\p{L}])\.?\s*/iu, '').trim();

function typoPl(t, on) {
  if (!on) return t;
  let s = t
    .replace(/\.\.\./g, '…')
    .replace(/(^|\n)[ \t]*(-{1,2}|—)[ \t]+/g, '$1– ')
    .replace(/ (-{1,2}|—) /g, ' – ')
    .replace(/"([^"\n]+)"/g, '„$1”')
    .replace(/„([^„”\n]*)"/g, '„$1”');
  // sierotki: jednoliterowe wyrazy nie zostają na końcu wiersza
  for (let i = 0; i < 2; i++) s = s.replace(/(^|[\s(„])([aiouwzAIOUWZ]) /g, '$1$2\u00a0');
  return s;
}

function bookScenes(p, ch) {
  return ch.scenes.filter(s => s.text.trim() && !s.exclude && (!p.book.onlyAccepted || s.status === 'accepted'));
}
function bookStructure(p) {
  const out = []; let n = 0;
  p.chapters.forEach(ch => {
    const scenes = bookScenes(p, ch);
    if (ch.part?.trim()) out.push({ type: 'part', title: ch.part.trim() });
    if (!scenes.length) return;
    n++;
    const sub = chapterSubtitle(ch.title);
    const label = chapterLabel(n, p.book.numbering);
    out.push({ type: 'chapter', id: ch.id, n, label: label || sub || ch.title, title: label ? sub : '', scenes: scenes.map(s => splitParas(typoPl(s.text, p.book.typo))) });
  });
  return out;
}
function bookStats(p) {
  let words = 0, chars = 0;
  p.chapters.forEach(ch => bookScenes(p, ch).forEach(s => { words += wc(s.text); chars += s.text.replace(/\n+/g, ' ').length; }));
  return { words, chars, norm: chars / 1800, ark: chars / 40000, print: Math.ceil(chars / 2100) };
}

function bookHtml(p) {
  const b = p.book, st = bookStructure(p);
  let h = `<section class="front"><h1>${esc(p.title)}</h1>${b.subtitle ? `<div class="sub">${esc(b.subtitle)}</div>` : ''}${b.author ? `<div class="auth">${esc(b.author)}</div>` : ''}</section>`;
  if (b.dedication.trim()) h += `<div class="dedic">${esc(b.dedication).replace(/\n/g, '<br>')}</div>`;
  if (b.motto.trim()) h += `<div class="motto">${esc(b.motto).replace(/\n/g, '<br>')}${b.mottoSource ? `<br>— ${esc(b.mottoSource)}` : ''}</div>`;
  for (const x of st) {
    if (x.type === 'part') { h += `<div class="part">${esc(x.title)}</div>`; continue; }
    h += `<h2 id="bk_${x.id}">${esc(x.label)}</h2>${x.title ? `<div class="chap-sub">${esc(x.title)}</div>` : ''}`;
    x.scenes.forEach((paras, i) => {
      if (i) h += `<div class="sep">${esc(b.sep)}</div>`;
      h += paras.map(t => `<p>${esc(t)}</p>`).join('');
    });
  }
  if (!st.some(x => x.type === 'chapter')) h += `<p class="noind muted">Książka jest jeszcze pusta. Napisz pierwszą scenę.</p>`;
  return h;
}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files, type) {

  for (const f of files) {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const flag = f.name === 'mimetype' ? 0 : 0x0800;

    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, flag, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, flag, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true); cd.setUint16(14, dosDate, true); cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);

/* ============================== Synchronizacja (prywatny GitHub Gist) ============================== */
// Każda opowieść to plik p-<id>.json, dataset do fine-tune'u w kawałkach d-<id>-<n>.json (po 20 wpisów),
// a atrament-index.json trzyma numer wersji każdej opowieści. Zmiany wykrywamy po numerze wersji, nie po zegarze urządzenia.
const GH = 'https://api.github.com', SYNC_DESC = 'Atrament: synchronizacja (nie edytuj ręcznie)', SHARD = 20, INDEX = 'atrament-index.json';
let syncBusy = false, syncT = null, syncState = '';
