// --- zip (bez kompresji) dla EPUB i DOCX
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files, type) {
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const flag = f.name === 'mimetype' ? 0 : 0x0800;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, flag, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, flag, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true); cd.setUint16(14, dosDate, true); cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true); cd.setUint32(42, off, true);
    central.push(new Uint8Array(cd.buffer), name);
    off += 30 + name.length + data.length;
  }
  const size = central.reduce((a, x) => a + x.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, size, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type });
}
const xesc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

function buildEpub(p) {
  const b = p.book, st = bookStructure(p), uuid = p.epubId || (p.epubId = 'urn:uuid:' + (crypto.randomUUID?.() || uid('x')));
  const xh = (title, body) => `<?xml version="1.0" encoding="utf-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="pl" lang="pl"><head><meta charset="utf-8"/><title>${xesc(title)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head><body>${body}</body></html>`;
  const files = [{ name: 'mimetype', data: 'application/epub+zip' },
    { name: 'META-INF/container.xml', data: `<?xml version="1.0" encoding="UTF-8"?>\n<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>` },
    { name: 'OEBPS/style.css', data: `body{font-family:serif;line-height:1.5;margin:0 4%;}p{margin:0;text-indent:1.4em;text-align:justify;hyphens:auto;-webkit-hyphens:auto;}p.first{text-indent:0;}h1{text-align:center;font-size:1.9em;margin:3em 0 .4em;}h2{text-align:center;font-size:.95em;font-weight:normal;letter-spacing:.15em;text-transform:uppercase;margin:3em 0 .2em;}.sub{text-align:center;font-size:1.35em;font-weight:bold;margin:0 0 2em;}.subt{text-align:center;font-style:italic;}.auth{text-align:center;margin-top:2em;letter-spacing:.1em;text-transform:uppercase;}.sep{text-align:center;margin:1.2em 0;text-indent:0;}.part{text-align:center;font-size:1.6em;margin-top:35%;}.ded{text-align:center;font-style:italic;margin-top:30%;}.motto{text-align:right;font-style:italic;margin:30% 0 0 30%;}` }];
  const items = [], spine = [], nav = [];
  const add = (id, title, body, inToc) => { const f = id + '.xhtml'; files.push({ name: 'OEBPS/' + f, data: xh(title, body) }); items.push(`<item id="${id}" href="${f}" media-type="application/xhtml+xml"/>`); spine.push(`<itemref idref="${id}"/>`); if (inToc) nav.push(`<li><a href="${f}">${xesc(inToc)}</a></li>`); };
  add('tytul', p.title, `<section epub:type="titlepage"><h1>${xesc(p.title)}</h1>${b.subtitle ? `<p class="subt first">${xesc(b.subtitle)}</p>` : ''}${b.author ? `<p class="auth first">${xesc(b.author)}</p>` : ''}</section>`);
  if (b.dedication.trim()) add('dedykacja', 'Dedykacja', `<p class="ded first">${xesc(b.dedication).replace(/\n/g, '<br/>')}</p>`);
  if (b.motto.trim()) add('motto', 'Motto', `<p class="motto first">${xesc(b.motto).replace(/\n/g, '<br/>')}${b.mottoSource ? `<br/>— ${xesc(b.mottoSource)}` : ''}</p>`);
  let k = 0;
  for (const x of st) {
    k++;
    const id = (x.type === 'part' ? 'czesc' : 'rozdzial') + String(k).padStart(3, '0');
    if (x.type === 'part') { add(id, x.title, `<section epub:type="part"><p class="part first">${xesc(x.title)}</p></section>`, x.title); continue; }
    let body = `<section epub:type="chapter"><h2>${xesc(x.label)}</h2>${x.title ? `<p class="sub first">${xesc(x.title)}</p>` : ''}`;
    x.scenes.forEach((paras, i) => { if (i) body += `<p class="sep">${xesc(b.sep)}</p>`; body += paras.map((t, j) => `<p${j === 0 ? ' class="first"' : ''}>${xesc(t)}</p>`).join(''); });
    add(id, x.label, body + '</section>', x.label + (x.title ? '. ' + x.title : ''));
  }
  files.push({ name: 'OEBPS/nav.xhtml', data: xh('Spis treści', `<nav epub:type="toc" id="toc"><h2>Spis treści</h2><ol>${nav.join('')}</ol></nav>`) });
  const mod = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  files.push({ name: 'OEBPS/content.opf', data: `<?xml version="1.0" encoding="utf-8"?>\n<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid" xml:lang="pl"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="bookid">${xesc(uuid)}</dc:identifier><dc:title>${xesc(p.title)}</dc:title><dc:language>pl</dc:language>${b.author ? `<dc:creator>${xesc(b.author)}</dc:creator>` : ''}${b.blurb ? `<dc:description>${xesc(b.blurb)}</dc:description>` : ''}<meta property="dcterms:modified">${mod}</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="css" href="style.css" media-type="text/css"/>${items.join('')}</manifest><spine>${spine.join('')}</spine></package>` });
  saveProject();
  return makeZip(files, 'application/epub+zip');
}

function buildDocx(p) {
  const b = p.book, st = bookStructure(p);

  const para = (t, style, extra = '') => `<w:p><w:pPr>${style ? `<w:pStyle w:val="${style}"/>` : ''}${extra}</w:pPr>${String(t).split('\n').map((l, i) => (i ? '<w:r><w:br/></w:r>' : '') + run(l)).join('')}</w:p>`;
  const brk = '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
  let body = para(p.title, 'Title') + (b.subtitle ? para(b.subtitle, 'Subtitle') : '') + (b.author ? para(b.author, 'Autor') : '');
  if (b.dedication.trim()) body += brk + para(b.dedication, 'Dedykacja');
  if (b.motto.trim()) body += brk + para(b.motto + (b.mottoSource ? '\n— ' + b.mottoSource : ''), 'Motto');
  for (const x of st) {
    if (x.type === 'part') { body += para(x.title, 'Czesc'); continue; }
    body += para(x.label, 'Heading1') + (x.title ? para(x.title, 'Podtytul') : '');

  }

<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/><w:pPr><w:ind w:firstLine="709"/><w:jc w:val="both"/></w:pPr></w:style>
${sty('Pierwszy', 'Akapit pierwszy', '<w:ind w:firstLine="0"/>', '')}
${sty('Title', 'Title', '<w:spacing w:before="2400" w:after="240"/><w:ind w:firstLine="0"/><w:jc w:val="center"/>', '<w:b/><w:sz w:val="48"/>')}
${sty('Subtitle', 'Subtitle', '<w:ind w:firstLine="0"/><w:jc w:val="center"/>', '<w:i/><w:sz w:val="28"/>')}
${sty('Autor', 'Autor', '<w:spacing w:before="720"/><w:ind w:firstLine="0"/><w:jc w:val="center"/>', '<w:caps/><w:spacing w:val="20"/>')}
${sty('Dedykacja', 'Dedykacja', '<w:spacing w:before="2400"/><w:ind w:firstLine="0"/><w:jc w:val="center"/>', '<w:i/>')}
${sty('Motto', 'Motto', '<w:spacing w:before="2400"/><w:ind w:left="3402" w:firstLine="0"/><w:jc w:val="right"/>', '<w:i/>')}
${sty('Czesc', 'Część', '<w:pageBreakBefore/><w:spacing w:before="3600"/><w:ind w:firstLine="0"/><w:jc w:val="center"/><w:outlineLvl w:val="0"/>', '<w:b/><w:sz w:val="36"/>')}
${sty('Heading1', 'heading 1', '<w:keepNext/><w:pageBreakBefore/><w:spacing w:before="1440" w:after="120"/><w:ind w:firstLine="0"/><w:jc w:val="center"/><w:outlineLvl w:val="1"/>', '<w:caps/><w:spacing w:val="30"/><w:sz w:val="24"/>')}
${sty('Podtytul', 'Tytuł rozdziału', '<w:keepNext/><w:spacing w:after="480"/><w:ind w:firstLine="0"/><w:jc w:val="center"/>', '<w:b/><w:sz w:val="32"/>')}

  return makeZip([
    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>` },

function buildMarkdown(p) {
  const b = p.book; let md = `# ${p.title}\n\n` + (b.subtitle ? `*${b.subtitle}*\n\n` : '') + (b.author ? `${b.author}\n\n` : '');
  for (const x of bookStructure(p)) {
    if (x.type === 'part') { md += `\n# ${x.title}\n\n`; continue; }
    md += `\n## ${x.label}${x.title ? ': ' + x.title : ''}\n\n` + x.scenes.map(ps => ps.join('\n\n')).join(`\n\n${b.sep}\n\n`) + '\n';
  }
  return md;
}

function migrate(p) {
  p.style = p.style || { guide: '', sample: '' };
  p.tics = p.tics || { detect: true, budget: 1 };
  p.dataset = p.dataset || { sft: [], dpo: [] };
  p.book = { ...defaultBook(), ...(p.book || {}) };
  if (p.banned == null) p.banned = DEFAULT_BANNED.join('\n');
  p.characters = p.characters || []; p.events = p.events || []; p.threads = p.threads || [];
  if (!p.chapters?.length) p.chapters = [{ id: uid('c'), title: 'Rozdział 1', summary: '', scenes: [] }];
  if (!p.chapters.some(c => c.id === p.currentChapter)) p.currentChapter = p.chapters[0].id;
  return p;
}
(async function init() {
  await DB.open();
  const st = await DB.get('settings');
  S.settings = { ...DEFAULT_SETTINGS, ...(st || {}), roles: { ...DEFAULT_SETTINGS.roles, ...(st?.roles || {}) } };
  S.projects = (await DB.get('projects')) || [];
  if (!S.projects.length) {
    const p = sampleProject(); await DB.set('p:' + p.id, p);
    S.projects = [{ id: p.id, title: p.title, updated: p.updated }]; await DB.set('projects', S.projects);
  }
  const id = S.settings.lastProject && S.projects.some(x => x.id === S.settings.lastProject) ? S.settings.lastProject : S.projects[0].id;
  S.project = migrate(await DB.get('p:' + id));
  render();
  try { navigator.storage?.persist?.(); } catch {}
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  }
})();
addEventListener('beforeunload', () => { if (S.project) DB.set('p:' + S.project.id, S.project); });
