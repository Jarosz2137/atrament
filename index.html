function syncStatusText() {
  const st = S.settings;
  if (!st.ghToken) return 'Wyłączona. Wklej token, żeby włączyć.';
  if (syncState === 'sync') return 'Synchronizuję…';
  if (syncState === 'err') return 'Ostatnia próba się nie udała. Stuknij „Synchronizuj teraz”, żeby zobaczyć błąd.';
  return st.lastSync ? 'Ostatnia synchronizacja: ' + new Date(st.lastSync).toLocaleString('pl-PL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'Jeszcze nie synchronizowano.';
}
function setSyncState(v) { syncState = v; const el = $('#syncStatus'); if (el) el.textContent = syncStatusText(); }
async function gh(path, opt = {}) {
  let r;
  try {
    r = await fetch(GH + path, { ...opt, headers: { Authorization: 'Bearer ' + S.settings.ghToken.trim(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  } catch { throw new UserError('Brak połączenia z GitHubem.'); }
  if (r.status === 401) throw new UserError('Token GitHub jest nieprawidłowy albo wygasł. Wygeneruj nowy.');
  if (r.status === 403 || r.status === 404) { const t = await r.text().catch(() => ''); const e = new UserError('GitHub odmówił dostępu. Token musi mieć uprawnienie Gists: Read and write. ' + t.slice(0, 100)); e.status = r.status; throw e; }
  if (r.status === 422) throw new UserError('GitHub odrzucił dane synchronizacji (prawdopodobnie za duże).');
  if (!r.ok) throw new UserError('Błąd GitHub ' + r.status + '.');
  return r.status === 204 ? null : r.json();
}
async function findOrCreateGist() {
  if (S.settings.gistId) return S.settings.gistId;
  for (let page = 1; page <= 10; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    const g = list.find(x => x.description === SYNC_DESC);
    if (g) { S.settings.gistId = g.id; saveSettings(); return g.id; }
    if (list.length < 100) break;
  }
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: SYNC_DESC, public: false, files: { [INDEX]: { content: JSON.stringify({ v: 1, projects: {} }) } } }) });
  S.settings.gistId = g.id; saveSettings(); return g.id;
}
async function gistFileText(f) {
  if (!f) return null;
  if (!f.truncated) return f.content;
  const r = await fetch(f.raw_url);
  if (!r.ok) throw new UserError('Nie udało się pobrać pliku synchronizacji z GitHuba.');
  return r.text();
}
const shardSig = sh => `${sh.sft.length}:${sh.dpo.length}:${Math.max(0, ...sh.sft.map(e => e.at || 0), ...sh.dpo.map(e => e.at || 0))}`;

  const out = {};
  for (const kind of ['sft', 'dpo']) for (const e of p.dataset?.[kind] || []) { const k = e.sh ?? 0; (out[k] ||= { sft: [], dpo: [] })[kind].push(e); }

function upsertMeta(p) {
  const meta = { id: p.id, title: p.title, updated: p.updated };
  const i = S.projects.findIndex(x => x.id === p.id); if (i >= 0) S.projects[i] = meta; else S.projects.push(meta);
}
async function removeLocal(pid) {
  await DB.del('p:' + pid); S.projects = S.projects.filter(x => x.id !== pid);
  if (S.project?.id === pid) {
    if (S.projects[0]) S.project = migrate(await DB.get('p:' + S.projects[0].id));
    else { const p = newProject('Nowa opowieść'); p.dirty = false; S.project = p; await DB.set('p:' + p.id, p); S.projects = [{ id: p.id, title: p.title, updated: p.updated }]; }
    S.sceneId = null; return true;
  }
  return false;
}
async function syncNow({ quiet } = {}) {
  if (!S.settings?.ghToken || syncBusy) return;
  if (GEN) return scheduleSync(5000);
  syncBusy = true; setSyncState('sync');
  let rerender = false, pulled = 0, pushed = 0, conflicts = 0;
  try {
    // najpierw zapisz to, co czeka w kolejce zapisu
    if (saveT) { clearTimeout(saveT); saveT = null; await DB.set('p:' + S.project.id, S.project); upsertMeta(S.project); }
    const gid = await findOrCreateGist();
    let g;
    try { g = await gh('/gists/' + gid); }
    catch (e) { if (e.status === 404) { S.settings.gistId = ''; saveSettings(); } throw e; }
    const files = g.files || {};
    const idx = JSON.parse((await gistFileText(files[INDEX])) || '{"v":1,"projects":{}}');
    idx.projects ||= {};
    const out = {};
    let idxChanged = false;

    // usunięte na tym urządzeniu
    for (const pid of S.settings.syncDeleted || []) {
      idx.projects[pid] = { deleted: true, rev: (idx.projects[pid]?.rev || 0) + 1 };
      for (const n of Object.keys(files)) if (n === `p-${pid}.json` || n.startsWith(`d-${pid}-`)) out[n] = null;
      idxChanged = true;
    }
    const pendingDeleted = [...(S.settings.syncDeleted || [])];

    // z chmury do urządzenia
    for (const [pid, meta] of Object.entries(idx.projects)) {
      const has = S.projects.some(x => x.id === pid);
      if (meta.deleted) { if (has && !pendingDeleted.includes(pid)) { if (await removeLocal(pid)) rerender = true; pulled++; } continue; }
      const local = has ? (S.project?.id === pid ? S.project : await DB.get('p:' + pid)) : null;
      if (local && (meta.rev || 0) <= (local.syncRev || 0)) continue;
      if (local && local.dirty) {
        // ta sama opowieść zmieniona na dwóch urządzeniach: wersja z tego urządzenia zostaje jako kopia
        const copy = JSON.parse(JSON.stringify(local));
        Object.assign(copy, { id: uid('p'), title: local.title + ' (kopia z konfliktu)', syncRev: 0, dirty: true, updated: Date.now() });
        await DB.set('p:' + copy.id, copy); upsertMeta(copy); conflicts++;
      }
      const coreText = await gistFileText(files[`p-${pid}.json`]);
      if (!coreText) continue;
      const core = JSON.parse(coreText);
      const ds = { sft: [], dpo: [], seq: core.dsSeq || 0 }, sig = {};
      for (const [n, f] of Object.entries(files)) {

        const k = n.slice(`d-${pid}-`.length, -5);
        const sh = JSON.parse(await gistFileText(f));

      }

      delete core.dsSeq;

      Object.assign(proj, { syncRev: meta.rev || 0, syncSig: sig, dirty: false });
      await DB.set('p:' + pid, proj); upsertMeta(proj);
      if (S.project?.id === pid) { S.project = proj; if (S.sceneId && !curScene()) S.sceneId = null; rerender = true; }

    }

    // z urządzenia do chmury
    const snaps = [];
    for (const m of [...S.projects]) {
      const p = S.project?.id === m.id ? S.project : await DB.get('p:' + m.id);
      if (!p || p.sample) continue;
      const meta = idx.projects[p.id];
      if (meta && !meta.deleted && !p.dirty) continue;

      core.dsSeq = dataset?.seq || 0;
      out[`p-${p.id}.json`] = { content: JSON.stringify(core) };
      const sig = {};
      for (const [k, sh] of Object.entries(shardsOf(p))) { sig[k] = shardSig(sh); if ((syncSig || {})[k] !== sig[k]) out[`d-${p.id}-${k}.json`] = { content: JSON.stringify(sh) }; }
      for (const k of Object.keys(syncSig || {})) if (!(k in sig) && files[`d-${p.id}-${k}.json`]) out[`d-${p.id}-${k}.json`] = null;
      const rev = (meta?.rev || 0) + 1;
      idx.projects[p.id] = { title: p.title, rev, at: Date.now() }; idxChanged = true;
      snaps.push({ p, rev, sig, updated: p.updated });
    }

    for (const [n, v] of Object.entries(out)) if (v === null && !files[n]) delete out[n];
    if (idxChanged || Object.keys(out).length) {
      out[INDEX] = { content: JSON.stringify(idx) };
      await gh('/gists/' + gid, { method: 'PATCH', body: JSON.stringify({ files: out }) });
      for (const sn of snaps) {
        Object.assign(sn.p, { syncRev: sn.rev, syncSig: sn.sig });
        if (sn.p.updated === sn.updated) sn.p.dirty = false; // zmiany wpisane w trakcie synchronizacji polecą następnym razem
        await DB.set('p:' + sn.p.id, sn.p);
      }
      pushed = snaps.length;
      S.settings.syncDeleted = (S.settings.syncDeleted || []).filter(x => !pendingDeleted.includes(x));
    }
    await DB.set('projects', S.projects);
    S.settings.lastSync = Date.now(); saveSettings();
    setSyncState('ok');
    if (rerender && !GEN) render(); else if ($('#projName') && S.project) $('#projName').textContent = S.project.title;
    if (conflicts) toast(`Ta sama opowieść była zmieniona na dwóch urządzeniach. Twoja wersja z tego urządzenia jest zapisana jako „kopia z konfliktu”.`, true);
    else if (!quiet) toast(pulled || pushed ? `Zsynchronizowano: pobrano ${pulled}, wysłano ${pushed}.` : 'Wszystko aktualne.');
  } catch (e) {
    setSyncState('err');
    if (!quiet) toastErr(e); else console.warn('sync', e);
  } finally { syncBusy = false; }
}
A.syncNow = async (id, b) => {
  if (b) { b.disabled = true; b.innerHTML = '<span class="spinner"></span> Synchronizuję…'; }
  await syncNow();
  if (S.view === 'settings') render();
};

/* ============================== Start ============================== */
function migrate(p) {
  p.style = p.style || { guide: '', sample: '' }; if (p.style.facts == null) p.style.facts = '';
  p.tics = p.tics || { detect: true, budget: 1 };
  p.dataset = p.dataset || { sft: [], dpo: [] };
  p.book = { ...defaultBook(), ...(p.book || {}) };
  if (p.banned == null) p.banned = DEFAULT_BANNED.join('\n');
  if (p.dict == null) p.dict = '';
  p.characters = p.characters || []; p.events = p.events || []; p.threads = p.threads || [];
  if (!p.chapters?.length) p.chapters = [{ id: uid('c'), title: 'Rozdział 1', summary: '', scenes: [] }];
  if (!p.chapters.some(c => c.id === p.currentChapter)) p.currentChapter = p.chapters[0].id;
  return p;
}
(async function init() {
  await DB.open();
  const st = await DB.get('settings');
  S.settings = { ...DEFAULT_SETTINGS, ...(st || {}), roles: { ...DEFAULT_SETTINGS.roles, ...(st?.roles || {}) } };
  if (st && !st.engine) { const m = { anthropic: 'claude', openai: 'openai', gemini: 'gemini', moonshot: 'kimi', openrouter: 'openrouter' }; S.settings.engine = m[S.settings.roles.writer.provider] || 'claude'; }
  S.projects = (await DB.get('projects')) || [];
  if (!S.projects.length) {
    const p = sampleProject(); await DB.set('p:' + p.id, p);
    S.projects = [{ id: p.id, title: p.title, updated: p.updated }]; await DB.set('projects', S.projects);
  }
  const id = S.settings.lastProject && S.projects.some(x => x.id === S.settings.lastProject) ? S.settings.lastProject : S.projects[0].id;
  S.project = migrate(await DB.get('p:' + id));
  render();
  try { navigator.storage?.persist?.(); } catch {}
  syncNow({ quiet: true });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow({ quiet: true }); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  }
})();
addEventListener('beforeunload', () => { if (S.project) DB.set('p:' + S.project.id, S.project); });
</script>
